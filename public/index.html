// Fila de catálogo a partir de un producto que hoy está fuera: guarda todas sus formas de factura como alternos
function filaDesdeProducto(D, c, codigo){
  // Código: el de la factura; si no tiene, el "modelo" que aparece en el nombre (ej. 6PK-1090); si no, el nombre
  const modelo = String(c.name||'').split(/\s+/).map(t=>t.replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/gi,'')).find(t=>t.length>=3 && /[A-Z]/i.test(t) && /\d/.test(t)) || '';
  const code = String(codigo || c.code || '').trim() || (looksCode(c.name) ? c.name : modelo);
  const alt = [];
  const add = x => { x = String(x||'').trim(); if(x && compact(x)!==compact(code) && !alt.some(a=>compact(a)===compact(x))) alt.push(x); };
  (c.variantes||[]).forEach(v=>add(v.split(' · ')[0]));
  return {c: code || c.name, n: norm(c.name), f: norm(c.fam||''), k: c.cat==='Otros' ? '' : c.cat, a: alt.join(', '), p: c.aplic||'', b: ''};
}
async function agregarAlCatalogo(D, lista){
  const rows = (S.catalogo.rows||[]).slice(), ya = new Set(rows.map(r=>compact(r.c)));
  let n = 0;
  for(const c of lista){ let r = filaDesdeProducto(D, c); if(r.c && ya.has(compact(r.c))) r = filaDesdeProducto(D, Object.assign({}, c, {code:''}), c.name); if(!r.c || ya.has(compact(r.c))) continue; rows.push(r); ya.add(compact(r.c)); n++; }
  if(!n) return 0;
  // las correcciones sueltas de esos productos quedan dentro de la fila del catálogo
  const aj = JSON.parse(JSON.stringify(S.ajustes)); const keys = new Set(lista.map(c=>c.key));
  for(const m of ['nombres','familias','catProd']){ const o = aj[m]||{}; Object.keys(o).forEach(x=>{ if(keys.has(D.keyOf(x))) delete o[x]; }); aj[m] = o; }
  S.ajustes = aj; saveAjustes();
  S.catalogo_prevPartes = (S.catalogo.meta && S.catalogo.meta.partes) || 0;
  await guardarCatalogo(rows, (S.catalogo.meta && S.catalogo.meta.archivo) || 'Editado en la página');
  return n;
}
async function aplicarRevision(D, lista){
  const aj = JSON.parse(JSON.stringify(S.ajustes)); const nuevas = [];
  for(const r of lista){
    if(r.tipo==='nombre'){ aj.nombres = aj.nombres||{}; aj.nombres[r.orig] = r.fix; }
    else if(r.tipo==='falta'){ const c = D.cat[r.k]; if(!c) continue; const ref = (S.catalogo.rows||[]).find(x=>compact(x.c)===r.ref) || {};
      const fila = filaDesdeProducto(D, c, r.v); fila.n = norm(ref.n || c.name); fila.f = norm(ref.f || fila.f); fila.k = ref.k || fila.k || ''; fila.b = ref.b || ''; nuevas.push(fila);
      if(aj.nombres) delete aj.nombres[r.orig]; }
  }
  S.ajustes = aj; saveAjustes();
  if(nuevas.length){ const rows = (S.catalogo.rows||[]).slice(); nuevas.forEach(f=>{ if(!rows.some(x=>compact(x.c)===compact(f.c))) rows.push(f); }); S.catalogo_prevPartes = (S.catalogo.meta && S.catalogo.meta.partes) || 0; await guardarCatalogo(rows, (S.catalogo.meta && S.catalogo.meta.archivo) || 'Editado en la página'); }
}
async function guardarProducto(){
  const P = S.edp, rows = (S.catalogo.rows||[]).slice();
  const code = String(P.c||'').trim(), name = String(P.n||'').trim();
  if(!code || !name){ toast('El código y el nombre son obligatorios'); return false; }
  const K2 = compact(code), oldKey = P.key;
  const iOld = P.enCat ? rows.findIndex(r=>compact(r.c)===compact(P.origCode)) : -1;
  const iDup = rows.findIndex((r,i)=>compact(r.c)===K2 && i!==iOld);
  if(iDup>=0){ toast(`El código ${code} ya existe en tu catálogo (${rows[iDup].n||''}). Usa otro o únelos en Unificar productos.`); return false; }
  // Alternos: si cambió el código o el producto venía de facturas con otro código/nombre, se guardan para que las ventas sigan cruzando
  const alt = String(P.a||'').split(/[,;|]+/).map(x=>x.trim()).filter(Boolean);
  const addAlt = x => { x = String(x||'').trim(); if(x && compact(x)!==K2 && !alt.some(a=>compact(a)===compact(x))) alt.push(x); };
  if(P.origCode && compact(P.origCode)!==K2) addAlt(P.origCode);
  // Todas las formas en que aparece en las facturas quedan como alternos, para que siga cruzando aunque cambies el código
  (P.variantes||[]).forEach(v=>{ const x = v.split(' · ')[0]; if(looksCode(x) || (!P.enCat && oldKey.startsWith('D:'))) addAlt(x); });
  const row = {c:code, n:norm(name), f:norm(P.f||''), k:String(P.k||'').trim(), a:alt.join(', '), p:String(P.p||'').trim(), b:String(P.b||'').trim()};
  if(iOld>=0) rows[iOld] = row; else rows.push(row);
  // Las correcciones sueltas de este producto pasan a vivir en el catálogo
  const aj = JSON.parse(JSON.stringify(S.ajustes));
  for(const m of ['nombres','familias','catProd']){ const o = aj[m]||{}; Object.keys(o).forEach(x=>{ const kx = D.keyOf(x); if(kx===oldKey || kx===K2 || x===oldKey) delete o[x]; }); aj[m] = o; }
  if(aj.com && aj.com.prods && aj.com.prods[oldKey]!=null && oldKey!==K2){ aj.com.prods[K2] = aj.com.prods[oldKey]; delete aj.com.prods[oldKey]; }
  if(aj.alias) Object.keys(aj.alias).forEach(x=>{ if(D.keyOf(aj.alias[x])===oldKey) aj.alias[x] = code; });
  S.ajustes = aj; saveAjustes();
  if(oldKey!==K2){ const st = Object.assign({}, S.stock.items||{}); Object.keys(st).forEach(x=>{ if(D.keyOf(x)===oldKey){ st[K2] = st[x]; if(x!==K2) delete st[x]; } }); S.stock = Object.assign({}, S.stock, {items:st}); saveStock(); }
  S.catalogo_prevPartes = (S.catalogo.meta && S.catalogo.meta.partes) || 0;
  await guardarCatalogo(rows, (S.catalogo.meta && S.catalogo.meta.archivo) || 'Editado en la página');
  return true;
}
function aplicarStock(items, fecha){
  const st = Object.assign({}, S.stock.items||{});
  for(const it of items){
    const k = it.k; if(!k) continue;
    Object.keys(st).forEach(x=>{ if(x!==k && D && D.keyOf(x)===k) delete st[x]; });
    const o = Object.assign({}, st[k]||{});
    if(it.cant!=null && !isNaN(it.cant)){ o.cant = it.cant; o.fecha = fecha; }
    if(it.min!=null && !isNaN(it.min)) o.min = it.min;
    if(o.cant==null && !o.min) delete st[k]; else st[k] = o;
  }
  S.stock = Object.assign({}, S.stock, {items:st}); saveStock();
}

  return `<div class="card np"><div class="sec-title"><h2>Nuevo producto</h2><span class="muted small">queda en tu catálogo aunque aún no lo hayas vendido</span></div>

function sugerencias(D, tot){

  const par = prods.map((_,i)=>i), find = i => par[i]===i ? i : (par[i] = find(par[i]));
  const P = prods.map(c=>partes(c.autoName));
  for(let i=0;i<prods.length;i++) for(let j=i+1;j<prods.length;j++){
    const a = P[i], b = P[j];
    if(![...a.W].some(x=>b.W.has(x)) && !(a.M.size && [...a.M].some(x=>b.M.has(x)))) continue;
    if(parecidos(prods[i].autoName, prods[j].autoName)) par[find(i)] = find(j);
  }
  const groups = {}; prods.forEach((c,i)=>{ (groups[find(i)] ||= []).push(c); });

}

function calcComisiones(D, L){
  const C = comAj(), porV = new Map(), porDoc = new Map();
  for(const l of L){
    const t = tasaCom(l, C), c = valN(l)*t/100;
    let v = porV.get(l.vend); if(!v){ v = {k:l.vend, venta:0, com:0, porTasa:{}, docs:new Set()}; porV.set(l.vend, v); }
    v.venta += valN(l); v.com += c; v.porTasa[t] = (v.porTasa[t]||{venta:0,com:0}); v.porTasa[t].venta += valN(l); v.porTasa[t].com += c; v.docs.add(l.doc);
    let d = porDoc.get(l.doc); if(!d){ d = {doc:l.doc, tipo:l.tipo, fecha:l.fecha, vend:l.vend, cliente:l.cliente, venta:0, com:0, tasas:new Set()}; porDoc.set(l.doc, d); }
    d.venta += valN(l); d.com += c; d.tasas.add(t);
  }
  return {C, vend:[...porV.values()].sort((a,b)=>b.com-a.com), docs:[...porDoc.values()].sort((a,b)=>a.fecha<b.fecha?1:-1)};
}

function vExtract(D){
  const x = S.ext;
  if(x.leyendo) return `<div class="callout info"><div>Leyendo ${esc(x.archivo)}…</div></div>`;
  if(x.error) return `<div class="callout bad"><div>${esc(x.error)}</div><button class="btn sm" data-act="ext-cerrar" style="margin-left:auto">Cerrar</button></div>`;
  const ok = x.lineas.filter(l=>l.ok).length;
  const tot = x.lineas.filter(l=>l.ok).reduce((a,l)=>a+l.cant*l.costo,0);
  return `<div class="card" style="background:var(--surface-2)"><div class="sec-title"><h2>Líneas leídas de ${esc(x.archivo)}</h2><span class="badge neutral">${esc(x.fuente)}</span><span class="muted small">${x.lineas.length} líneas · <b>${x.lineas.filter(l=>l.codigo && codOk(D,l.codigo)).length} reconocidas</b>${x.lineas.some(l=>!l.codigo)?` · <span style="color:var(--warn)">${x.lineas.filter(l=>!l.codigo).length} sin reconocer</span>`:''} · seleccionadas suman ${fmt(tot)}${x.info.subtotal?` · la factura dice ${fmt(x.info.subtotal)} sin IGV`:x.info.total?` · total del documento ${fmt(x.info.total)}`:''}</span></div>
  ${(()=>{ const i=x.info||{}; const kv=[['Proveedor',i.proveedor],['RUC',i.ruc],['Documento',i.ref],['Fecha',i.fecha],['Moneda',i.moneda==='PEN'?'S/':i.moneda?'US$':''],['Sin IGV',i.subtotal!=null?fmt(i.subtotal):''],['Total',i.total!=null?fmt(i.total):'']].filter(a=>a[1]); return kv.length?`<div class="xinfo">${kv.map(a=>`<span><em>${a[0]}</em> ${esc(a[1])}</span>`).join('')}<span class="muted small">se llenarán en el formulario si están vacíos</span></div>`:''; })()}
  ${S.form && S.form.proveedores && S.form.proveedores.length>1?`<div class="row" style="margin-bottom:8px"><label class="small" style="display:flex;gap:8px;align-items:center">Estas líneas son de la empresa<select data-xprov>${S.form.proveedores.map((p,j)=>`<option value="${esc(p.id)}" ${x.prov===p.id?'selected':''}>${esc(p.nombre||'Empresa '+(j+1))}</option>`).join('')}</select></label></div>`:''}
  ${(()=>{ const sq = x.lineas.reduce((a,l)=>a+(+l.cant||0),0), st = x.lineas.reduce((a,l)=>a+(+l.cant||0)*(+l.costo||0),0), i = x.info||{}; const av = [];
    if(i.totalQty && Math.abs(i.totalQty-sq)>0.5) av.push(`El documento dice <b>TOTAL QTY ${fmtU(i.totalQty)}</b>, pero las líneas suman <b>${fmtU(sq)}</b> unidades. Confirma con el proveedor cuántas unidades vienen.`);
    if(i.total && Math.abs(i.total-st) > Math.max(1, i.total*0.005)) av.push(`El total del documento (${fmt(i.total)}) no coincide con la suma de las líneas (${fmt(st)}).`);
    return av.length ? `<div class="callout warn"><div>${av.join('<br>')}</div></div>` : ''; })()}
  ${x.fuente!=='XML'?`<p class="hint">Lectura automática de un ${x.fuente==='Excel'?'Excel':'PDF'} con formato desconocido: <b>revisa cantidades y costos</b> antes de agregar. Desmarca las líneas que no sean productos (flete, descuentos…).</p>`:''}
  ${x.lineas.length? `<div class="tbl-wrap" style="max-height:360px"><table class="lines"><thead><tr><th style="width:34px"></th><th>Cód. proveedor</th><th>Código propio</th><th>Descripción</th><th class="num">Cantidad</th><th class="num">Costo unit.</th></tr></thead><tbody>
  ${x.lineas.map((l,i)=>`<tr><td><input type="checkbox" data-x="${i}" data-xk="ok" ${l.ok?'checked':''}></td><td class="mono small">${esc(l.codProv)}</td><td><input type="text" list="dl-cod" data-x="${i}" data-xk="codigo" value="${esc(l.codigo||'')}" placeholder="¿cuál es tu código?" style="${l.codigo && !codOk(D,l.codigo)?'border-color:var(--warn)':''}">${l.auto?`<div class="pcode">reconocido: ${esc(l.auto)}</div>`:''}</td><td><input type="text" data-x="${i}" data-xk="descripcion" value="${esc(l.descripcion)}"></td><td><input type="number" step="any" data-x="${i}" data-xk="cant" value="${esc(l.cant)}" style="text-align:right;width:100px"></td><td><input type="number" step="any" data-x="${i}" data-xk="costo" value="${esc(l.costo)}" style="text-align:right;width:110px"></td></tr>`).join('')}
  </tbody></table></div>` : `<div class="callout warn"><div>No reconocí líneas de productos en este archivo. Pégalas desde Excel o escríbelas.</div></div>`}
  <div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="ext-agregar" ${ok?'':'disabled'}>Agregar ${ok} líneas a la compra</button><button class="btn sm" data-act="ext-cerrar">Descartar</button></div></div>`;
}

function vDocumentos(D){
  const rep = D.rep, CF = S.conf.m || {};
  const docs = D.docs.slice().sort((a,b)=> (a.fecha||'')<(b.fecha||'')?1:-1);
  const vivos = docs.filter(d=>!d.excluido);
  const conAv = vivos.filter(d=>d.avisos.length);
  const pend = vivos.filter(d=>!CF[d.doc]), pendAv = pend.filter(d=>d.avisos.length);
  const falt = Object.values(rep).filter(r=>!r.anulado && !S.ventas[r.doc] && !/^[FB]C/.test(r.doc)).sort((a,b)=>a.doc<b.doc?-1:1);
  let list = docs;
  const F = S.docsF;
  if(F.solo==='avisos') list = conAv;

async function handleBackupRestore(file){
  if(!window.PASEGA_BACKUP){ toast('Módulo de respaldo no disponible.'); return; }
  if(!(await confirmar('Restaurar respaldo', `Se cargarán los registros de "${file.name}" en Supabase (se actualizarán los existentes con el mismo ID). ¿Continuar?`, {ok:'Restaurar', no:'Cancelar'}))) return;
  S.bkMsg = `<div class="callout info" style="margin-top:12px"><div>Restaurando ${esc(file.name)}…</div></div>`; render();
  try{
    const r = await window.PASEGA_BACKUP.restoreJSON(file, (done, tot)=>{
      const box = document.getElementById('p-bk');
      if(box) box.innerHTML = `<div class="callout info" style="margin-top:12px"><div>Restaurando ${done} de ${tot} registros…</div></div>`;
    });
    S.bkMsg = `<div class="callout good" style="margin-top:12px"><div><b>Respaldo restaurado:</b> ${r.restored} registros cargados. Recargando panel…</div></div>`; render();
    setTimeout(()=>window.location.reload(), 1100);
  }catch(e){
    S.bkMsg = `<div class="callout bad" style="margin-top:12px"><div>${esc(e.message||String(e))}</div></div>`; render();
  }
}

/* ============ Render ============ */
let D = null, rendering = false, pendingR = false;
function render(){
  if(rendering){ pendingR = true; return; }
  rendering = true;
  try{ doRender(); } finally { rendering = false; }
  if(pendingR){ pendingR = false; setTimeout(render, 0); }
}
function doRender(){
  renderTabs();
  { const h1 = document.querySelector('header.top h1'), sub = document.querySelector('header.top .sub');
    if(h1) h1.textContent = S.mod==='carga' ? 'Cargar datos' : 'Finanzas · Ventas y rentabilidad';
    if(sub) sub.textContent = S.mod==='carga' ? 'Todo lo que alimenta el panel: ventas, compras, cobranzas y productos' : 'Sube tus comprobantes y compras; el reporte se arma solo'; }
  if(S.noAccess){ document.getElementById('view').innerHTML = `<div class="card empty"><div class="big">Este panel es privado</div><div>Los datos de ventas, costos y márgenes solo los ve su dueño. Si necesitas acceso, pídeselo.</div></div>`; return; }
  D = derive();
  const v = {resumen:vResumen, productos:vProductos, vendedores:vVendedores, rentabilidad:vRentabilidad, compras:vCompras, documentos:vDocumentos, cargar:vCargar}[S.tab] || vResumen;
  const ae = document.activeElement, sel = ae && ae.dataset ? Object.entries(ae.dataset).map(([k,v])=>`[data-${k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}="${CSS.escape(v)}"]`).join('') : '';
  const pos = ae && ae.type==='search' ? ae.selectionStart : null;
  document.getElementById('view').innerHTML = v(D);
  if(sel && ae.tagName==='INPUT' && ae.type==='search'){ const n = document.querySelector('#view '+sel); if(n){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos); }catch(e){} } }
}

/* ============ Carga de archivos ============ */
async function handlePdfs(files){
  const box = document.getElementById('p-pdf');
  const items = [];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      const z = await JSZip.loadAsync(f);
      for(const e of Object.values(z.files)) if(!e.dir && /\.pdf$/i.test(e.name) && !/__MACOSX/.test(e.name)) items.push({name:e.name.split('/').pop(), get:()=>e.async('arraybuffer')});
    } else if(/\.pdf$/i.test(f.name) || f.type==='application/pdf') items.push({name:f.name, get:()=>f.arrayBuffer()});
  }
  if(!items.length){ toast('No encontré PDFs en lo que subiste'); return; }
  box.innerHTML = `<div class="progress"><i id="pb"></i></div><div class="log" id="plog">Leyendo 0 de ${items.length}…</div>`;
  const pb = document.getElementById('pb'), log = document.getElementById('plog');
  const res = {ok:0, aviso:0, error:0, nuevos:0, reemplazados:0}, problemas = [];
  for(let i=0;i<items.length;i++){
    const it = items[i];
    try{
      const pages = await pdfPages(await it.get());
      if(esReportePdf(pages)){ problemas.push(`${it.name}: es el reporte de ventas del sistema; lo cargué como reporte`); await handleXls({name:it.name}, pages); continue; }
      const r = parsePages(pages);
      if(!r.doc){ res.error++; problemas.push(`${it.name}: no parece un comprobante de Pasega`); }
      else {
        r.archivo = it.name; r.cargado = new Date().toISOString();
        if(S.ventas[r.doc]) res.reemplazados++; else res.nuevos++;
        S.ventas = Object.assign({}, S.ventas, {[r.doc]: r});
        if(r.avisos.length){ res.aviso++; problemas.push(`${r.doc}: ${r.avisos.join('; ')}`); } else res.ok++;
        dbSet('ventas/'+r.doc, JSON.parse(JSON.stringify(r)));
      }
    }catch(e){ res.error++; problemas.push(`${it.name}: no se pudo leer (${e.message||e})`); }
    pb.style.width = ((i+1)/items.length*100)+'%';
    log.textContent = `Leyendo ${i+1} de ${items.length}…`;
  }
  log.textContent = 'Guardando…';
  await Q;
  box.innerHTML = `<div class="callout ${res.error||res.aviso?'warn':'info'}" style="margin-top:12px"><div><b>${res.ok+res.aviso} comprobantes leídos</b> (${res.nuevos} nuevos, ${res.reemplazados} reemplazados). ${res.ok} cuadran al céntimo${res.aviso?`, <b>${res.aviso} con observaciones</b>`:''}${res.error?`, <b>${res.error} no se pudieron leer</b>`:''}.${S.persist?'':' <b>Ojo:</b> en esta vista no se guarda nada.'}</div></div>${problemas.length?`<div class="log">${problemas.slice(0,80).map(esc).join('<br>')}</div>`:''}`;
  D = derive(); renderTabs();
}
async function handleXls(file, pagesPre){
  const box = document.getElementById('p-xls');
  try{
    let nuevos, totalG = null, sinLeer = [];
    if(pagesPre || /\.pdf$/i.test(file.name)){
      const pages = pagesPre || await pdfPages(await file.arrayBuffer());
      if(!pages.some(p=>p.items.some(i=>i.str.trim()))) throw new Error('Este PDF es una imagen escaneada: no tiene texto que leer. Expórtalo de nuevo desde el sistema como PDF o como Excel.');
      const r = parseReportePdf(pages); nuevos = r.rows; totalG = r.totalGeneral; sinLeer = r.sinLeer;
    } else {
      const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null});
      nuevos = parseReporte(rows); totalG = nuevos.__total || null;
    }
    const n = Object.keys(nuevos).length;
    if(!n) throw new Error('No encontré comprobantes en el archivo. ¿Es el "Reporte de ventas" del sistema?');
    const sumBase = Object.values(nuevos).filter(r=>!r.anulado).reduce((a,r)=>a+(r.base||0),0);
    const cuadra = totalG && totalG.base!=null ? Math.abs(sumBase-totalG.base) < 1 : null;
    const merged = Object.assign({}, (S.reporte&&S.reporte.rows)||{}, nuevos);
    S.reporte = {rows:merged, cargado:new Date().toISOString(), archivo:file.name};
    await dbSet('sistema/reporte', JSON.parse(JSON.stringify(S.reporte)));
    await Q;
    D = derive();
    const vals = Object.values(nuevos), an = vals.filter(r=>r.anulado).length, ncs = vals.filter(r=>/^[FB]C/.test(r.doc) && !r.anulado);
    const ncDocs = D.docs.filter(d=>d.tipo==='NC' && d.origen==='reporte'), conProd = ncDocs.filter(d=>d.n).length;
    const ncTot = ncs.reduce((a,r)=>a+Math.abs(r.base||0),0);
    const chk = cuadra===true ? `<span class="badge good">✓ Cuadra con el TOTAL GENERAL del reporte (S/ ${fmt(totalG.base)})</span><br>` : cuadra===false ? `<span class="badge bad">⚠ La suma leída (S/ ${fmt(sumBase)}) no coincide con el TOTAL GENERAL (S/ ${fmt(totalG.base)})</span> Revisa el formato del archivo antes de continuar.<br>` : '';
    const sl = sinLeer.length ? `<div class="log">${sinLeer.length} filas no se pudieron leer:<br>${sinLeer.slice(0,20).map(esc).join('<br>')}</div>` : '';
    box.innerHTML = `<div class="callout ${cuadra===false||sinLeer.length?'warn':'info'}" style="margin-top:12px"><div>${chk}<b>${n} comprobantes leídos del reporte</b>: ${n-ncs.length-an} facturas y boletas, <b>${ncs.length} notas de crédito</b> por S/ ${fmt(ncTot)} sin IGV, y ${an} anulados.<br>${ncs.length? `${conProd} notas anulan una factura completa ya cargada (se restan sus productos); ${ncDocs.length-conProd} se restan solo por monto hasta que subas el PDF de la factura que anulan. Las ves en <a href="#documentos" data-tab="documentos" data-solo="nc">Documentos → Solo notas de crédito</a>.`:''}</div></div>${sl}`;
  }catch(e){ box.innerHTML = `<div class="callout bad" style="margin-top:12px"><div>${esc(e.message||e)}</div></div>`; }
}
async function handleCompraFile(file){
  S.ext = {archivo:file.name, leyendo:true, lineas:[], info:{}}; render();
  try{
    const r = await readCompraFile(file);
    const P0 = S.form.proveedores ? (S.form.proveedores.find(p=>!p.nombre && !S.form.lineas.some(l=>l.prov===p.id && l.codigo)) || S.form.proveedores[S.form.proveedores.length-1]) : null;
    const prov = norm((P0 && P0.nombre) || r.info.proveedor || S.form.proveedor || '');
    const eq = (S.ajustes.equiv||{})[prov] || {};
    // Prioridad: código propio que venga en el archivo > equivalencia que tú pusiste a mano > reconocimiento automático por catálogo
    r.lineas.forEach(l=>{
      if(l.codigo){ l.auto = 'viene en el archivo'; return; }
      if(l.codProv && eq[l.codProv]){ l.codigo = eq[l.codProv]; l.auto = 'tu equivalencia guardada'; return; }
      const m = D.buscarCat(l.codProv, l.descripcion);
      if(m){ const cr = D.catalogo[m.k]; l.codigo = (cr && cr.c) || (D.cat[m.k]||{}).code || m.k; l.auto = m.como==='igual' ? '' : m.como; return; }
      if(l.codProv && D.cat[D.keyOf(l.codProv)]) l.codigo = l.codProv;
    });
    S.ext = {archivo:file.name, ...r, prov: P0 ? P0.id : ''};
  }catch(e){ S.ext = {archivo:file.name, error: e.message||String(e), lineas:[], info:{}}; }
  render();
}

      if(F.q){ const q = norm(F.q); list = list.filter(x=>(x.doc+' '+x.cliente+' '+x.vendedor).includes(q)); }
      list.forEach(x=>S.dsel.add(x.doc)); render(); break; }
    case 'dsel-pend': { const CF = S.conf.m||{}; D.docs.filter(x=>!x.excluido && !CF[x.doc] && !x.avisos.length).forEach(x=>S.dsel.add(x.doc)); render(); break; }
    case 'uni-limpiar': S.uni.sel = new Set(); S.uni.nombre = ''; render(); break;
    case 'uni-unir': { const keys = [...S.uni.sel].filter(k=>D.cat[k]); if(keys.length<2) break; const nm = (document.getElementById('uni-nombre')||{}).value || ''; unir(D, keys, nm); S.uni.sel = new Set(); S.uni.nombre=''; toast(`${keys.length} productos unidos en uno`); render(); break; }
    case 'inv-aplicar': {
      const txt = document.getElementById('inv-txt').value; let n = 0;
      const items = Object.assign({}, S.stock.items||{});
      for(const ln of txt.split(/\r?\n/)){
        const c = ln.split(/\t|;|\s{2,}/).map(s=>s.trim()).filter(Boolean); if(c.length<2) continue;
        const cant = parseNum(c[c.length-1]); if(cant==null) continue;
        const k = D.keyOf(c[0]); if(!k) continue;
        Object.keys(items).forEach(x=>{ if(x!==k && D.keyOf(x)===k) delete items[x]; });
        items[k] = Object.assign({}, items[k]||{}, {cant, fecha:today()}, (c.length>2 && !(D.cat[k]))?{desc:norm(c.slice(1,-1).join(' '))}:{}); n++;
      }
      S.stock = Object.assign({}, S.stock, {items}); saveStock(); S.inv.pegar = false; toast(`${n} conteos cargados`); render(); break; }
    case 'cats-guardar': {
      const out = []; for(const ln of document.getElementById('cats-txt').value.split(/\r?\n/)){ const m = ln.match(/^\s*([^:]+):\s*(.+)$/); if(!m) continue; const k = m[2].split(',').map(s=>norm(s)).filter(Boolean); if(k.length) out.push({n:m[1].trim(), k}); }
      if(!out.length){ toast('No reconocí ninguna categoría'); break; }
      S.ajustes = Object.assign({}, S.ajustes, {cats:out}); saveAjustes(); toast('Categorías guardadas'); render(); break; }
    case 'cats-reset': S.ajustes = Object.assign({}, S.ajustes, {cats:null}); saveAjustes(); render(); break;
  }
});

    updateFormCalc(); return; }

    return; }
  if(d.catedit!==undefined && S.prod.vista==='categorias'){ const o = Object.assign({}, S.ajustes.catProd||{}); o[d.catedit] = t.value; S.ajustes = Object.assign({}, S.ajustes, {catProd:o}); saveAjustes(); toast('Categoría asignada'); render(); return; }
  if(d.catedit!==undefined){ const o = Object.assign({}, S.ajustes.catProd||{}); const cr = (D.catalogo||{})[d.catedit]; const base = cr && cr.k ? cr.k : catAuto((D.cat[d.catedit]?.name||''), D.cat[d.catedit]?.code||''); if(t.value===base) delete o[d.catedit]; else o[d.catedit] = t.value; S.ajustes = Object.assign({}, S.ajustes, {catProd:o}); saveAjustes(); toast('Categoría guardada. Pulsa "Listo" para ver los totales actualizados.'); return; }
  if(d.famedit!==undefined){ const v = norm(t.value); t.value = v; const o = Object.assign({}, S.ajustes.familias); if(v) o[d.famedit]=v; else delete o[d.famedit]; S.ajustes = Object.assign({}, S.ajustes, {familias:o}); saveAjustes(); toast('Familia guardada. Pulsa "Listo" para ver los totales actualizados.'); return; }

  if(t.id==='f-xls'){ if(t.files[0]) handleXls(t.files[0]); t.value=''; return; }

  if(d.ep!==undefined){ if(S.edp) S.edp[d.ep] = t.value; return; }
