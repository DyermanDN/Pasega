name: CI · Validar Pasega

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  validar:
    name: Validar Pasega
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar validaciones y pruebas de seguridad
        run: npm test
