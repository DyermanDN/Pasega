<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface-1:#fcfcfb; --surface-2:#f0efea; --line:#e2e0d8; --line-strong:#cfccc1;
  --text-primary:#14171c; --text-secondary:#52514e; --text-muted:#85837c;
  --navy:#0f2f57; --navy-soft:#e5ecf5; --orange:#e8870e;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6; --series-8:#e34948;
  --good:#0d7a3e; --good-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf1dc; --bad:#b42318; --bad-bg:#fde8e6;
  --seq-1:#cde2fb; --seq-2:#86b6ef; --seq-3:#2a78d6;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121211; --surface-1:#1a1a19; --surface-2:#232321; --line:#2f2f2c; --line-strong:#3d3d39;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --navy:#8fb4e6; --navy-soft:#1f2a38; --orange:#f0a040;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#0ca30c; --series-7:#9085e9; --series-8:#e66767;
    --good:#5fd08f; --good-bg:#16301f; --warn:#f0b54a; --warn-bg:#33270f; --bad:#f08a80; --bad-bg:#3a1a17;
    --seq-1:#1c3350; --seq-2:#2a5b98; --seq-3:#3987e5;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--series-1)}
header.top{background:var(--navy);color:#fff;padding:18px 28px 0}
@media (prefers-color-scheme: dark){ header.top{background:#0d1a2b} }
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:9px;background:var(--orange);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}
.brand h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
.brand .sub{font-size:12.5px;opacity:.75}
.brand .status{margin-left:auto;font-size:12px;opacity:.85;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#7bd88f;display:inline-block}
.dot.off{background:#f0a040}
nav.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:#fff;opacity:.72;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:500;white-space:nowrap}
nav.tabs button:hover{opacity:1}
nav.tabs button.on{opacity:1;background:var(--bg);color:var(--text-primary)}
main{max-width:1240px;margin:0 auto;padding:20px 24px 60px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}
.filters label{display:flex;flex-direction:column;font-size:11.5px;color:var(--text-secondary);gap:4px;font-weight:500}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface-1);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;min-height:36px}
textarea{min-height:90px;width:100%;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--series-1);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface-1)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;min-height:34px}
.seg button.on{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){ .seg button.on{color:#0d1a2b} }
.btn{border:1px solid var(--line-strong);background:var(--surface-1);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:36px;font-weight:500}
.btn:hover{border-color:var(--text-muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){ .btn.primary{color:#0d1a2b} }
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:28px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spacer{flex:1}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 4px;font-weight:600}
.card .hint{color:var(--text-secondary);font-size:12.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--text-secondary);font-weight:500}
.kpi .v{font-size:23px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--text-muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);background:var(--surface-1);position:sticky;top:0;z-index:1}
th.num{text-align:right;font-family:inherit}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.tot td{font-weight:600;border-top:1px solid var(--line-strong);background:var(--surface-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.tbl-wrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:8px}
.tbl-wrap table th:first-child,.tbl-wrap table td:first-child{padding-left:12px}
.pname{font-weight:500}
.pcode{font-size:11.5px;color:var(--text-muted);font-family:"IBM Plex Mono",monospace}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.neutral{background:var(--surface-2);color:var(--text-secondary)}
.callout{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.info{background:var(--navy-soft);color:var(--text-primary)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.good{background:var(--good-bg);color:var(--good)}
.callout b{font-weight:600}
.drop{border:2px dashed var(--line-strong);border-radius:var(--r);padding:26px;text-align:center;background:var(--surface-2);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--series-1);background:var(--navy-soft)}
.drop .big{font-weight:600;font-size:15px}
.drop .small{color:var(--text-secondary);font-size:12.5px;margin-top:4px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--series-1);width:0;transition:width .2s}
.log{font-size:12.5px;margin-top:10px;color:var(--text-secondary);max-height:180px;overflow:auto}
.bar-cell{display:flex;align-items:center;gap:8px;min-width:140px}
.bar-cell i{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--series-1);min-width:2px}
.hbar{display:grid;grid-template-columns:minmax(120px,240px) 1fr auto;gap:10px;align-items:center;padding:5px 0}
.hbar .t{height:18px;background:var(--surface-2);border-radius:0 4px 4px 0;position:relative}
.hbar .t i{position:absolute;inset:0 auto 0 0;background:var(--series-1);border-radius:0 4px 4px 0}
.hbar .n{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text-secondary);font-size:11px;font-family:"IBM Plex Sans",sans-serif}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-strong);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .bar, .chart g.col:hover .bar{opacity:.85}
#tip{position:fixed;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12px;padding:7px 10px;border-radius:7px;z-index:50;display:none;max-width:280px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip b{font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--text-secondary)}
.empty .big{font-size:17px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-secondary);font-weight:500}
.lines input{width:100%;min-height:32px;padding:5px 8px}
.lines td{padding:4px 6px}
.muted{color:var(--text-muted)}
.small{font-size:12.5px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-title h2{margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
details summary{cursor:pointer;color:var(--text-secondary);font-size:12.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--surface-1);padding:10px 16px;border-radius:9px;font-size:13px;z-index:60;display:none}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:70}
.modal{background:var(--surface-1);border-radius:12px;padding:20px 22px;max-width:420px;width:92%}
.modal h3{margin:0 0 8px;font-size:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

.subnav{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
.chip{border:1px solid var(--line-strong);background:var(--surface-1);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:2px}
.chip span{color:var(--text-muted);margin-left:6px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on span{color:inherit;opacity:.8}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.hero-grid{align-items:start;display:grid;grid-template-columns:minmax(240px,.9fr) minmax(300px,1.1fr) minmax(320px,1.3fr);gap:18px}
@media (max-width:1100px){.hero-grid{grid-template-columns:1fr 1fr}.hero-grid>:last-child{grid-column:1/-1}}
@media (max-width:700px){.hero-grid{grid-template-columns:1fr}}
.hero .l{font-size:12px;color:var(--text-secondary);font-weight:500}
.hero-name{font-size:19px;font-weight:600;line-height:1.3;margin:8px 0 4px}
.hero-nums{display:flex;gap:22px;margin-top:16px}
.hero-nums b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.hero-nums span{font-size:12px;color:var(--text-secondary)}
.hero-alt{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-secondary)}
.dn-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut{width:180px;height:180px;flex:none}
.donut path,.donut circle{cursor:default}
.dn-v{fill:var(--text-primary);font-size:20px;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
.dn-l{fill:var(--text-secondary);font-size:11px;font-family:"IBM Plex Sans",sans-serif}
.dn-leg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.dn-leg div{display:flex;align-items:center;gap:8px}
.dn-leg i{width:10px;height:10px;border-radius:3px;flex:none}
.dn-leg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-leg b{font-weight:600;font-variant-numeric:tabular-nums}
.hbar .rk{width:18px;color:var(--text-muted);font-size:12px;text-align:right}
.hbar:has(.rk){grid-template-columns:18px minmax(110px,220px) 1fr auto}
.fh{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin:22px 0 10px;font-weight:600;border-top:1px solid var(--line);padding-top:16px}
.upl{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--navy-soft);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px;flex-wrap:wrap}
.upl.over{outline:2px dashed var(--series-1);outline-offset:2px}
.xinfo{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;margin-bottom:10px;align-items:center}
.xinfo em{font-style:normal;color:var(--text-muted);margin-right:4px}
.lines.wide{min-width:1180px}
.sug{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.sug-items{display:flex;flex-direction:column;gap:3px;font-size:13px}
.uni-bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:var(--navy-soft);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px}
.uni-bar label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-secondary)}
.conf-card{border-color:var(--line-strong)}
.conf-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.conf-top h2{margin:0 0 2px}
.conf-sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-secondary);cursor:pointer}
.chk input{width:16px;height:16px}
.pager{display:flex;gap:8px;align-items:center}
tr.selrow td{background:var(--navy-soft)}
.fact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:-6px 0 16px;font-size:13px}
.fact .chip.on{background:var(--warn);border-color:var(--warn);color:#fff}
.sug-act{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.sug-act label{display:flex;flex-direction:column;gap:4px}
.sug-items .chk{color:var(--text-primary);align-items:flex-start}
.dp-anchor{position:relative}
.filters .flab{display:flex;flex-direction:column;font-size:11.5px;color:var(--text-secondary);gap:4px;font-weight:500}
.dp-foot .chk{flex-direction:row}
.dp-btn{display:inline-flex;gap:8px;align-items:center;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.dp-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;display:flex;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 14px 40px rgba(10,20,40,.18);width:min(760px,94vw);max-height:560px;color:var(--text-primary);font-weight:400}
.dp-side{width:200px;flex:none;overflow:auto;padding:12px 6px 12px 12px;border-right:1px solid var(--line);font-size:13px}
.dp-sec{font-weight:600;font-size:12.5px;margin:8px 0 6px}
.dp-side hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.dp-opt{display:flex;gap:8px;align-items:center;padding:5px 2px;cursor:pointer;color:var(--text-primary);font-size:13px;flex-direction:row!important}
.dp-opt input{width:16px;height:16px;margin:0}
.dp-main{flex:1;padding:14px 16px;display:flex;flex-direction:column;min-width:0}
.dp-nav{display:flex;gap:8px;align-items:flex-start}
.dp-cals{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1}
@media (max-width:720px){.dp-cals{grid-template-columns:1fr}.dp-cals .dp-cal:last-child{display:none}.dp-side{width:150px}}
.dp-head{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.dp-head select{min-height:30px;padding:3px 6px;border:0;background:transparent;font-weight:600}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center}
.dp-w{font-size:11px;color:var(--text-muted);padding:4px 0}
.dp-d{border:0;background:none;height:30px;cursor:pointer;font-size:12.5px;border-radius:0;position:relative}
.dp-d:hover{background:var(--surface-2)}
.dp-d.dat::after{content:'';position:absolute;bottom:3px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--series-1)}
.dp-d.in{background:var(--navy-soft)}
.dp-d.edge{background:var(--navy);color:#fff;border-radius:6px}
.dp-d.hoy{font-weight:700;color:var(--series-1)}
.dp-d.edge.hoy{color:#fff}
.dp-d.fut{color:var(--text-muted)}
.dp-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dp-foot select{max-width:320px}
.dp-range{display:flex;gap:8px;align-items:center;font-size:13px}
.dp-box{border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;min-width:130px;background:var(--surface-1)}
.dp-acts{display:flex;gap:8px;align-items:center}
.kpi .dl{font-size:12px;margin-top:6px;font-weight:500}
.kpi .dl.up{color:var(--good)} .kpi .dl.down{color:var(--bad)}
@media (prefers-color-scheme: dark){ .dp-d.edge{color:#0d1a2b} }
.np{background:var(--navy-soft);border-color:var(--line-strong)}
.linkbtn{padding:0 6px;min-height:22px;border-color:transparent;background:none;color:var(--text-muted)}
.linkbtn:hover{color:var(--series-1);border-color:var(--line-strong)}
/* ---- Panel izquierdo ---- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.sidenav{background:#0a2242;color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 12px;z-index:30}
@media (prefers-color-scheme: dark){ .sidenav{background:#09121e;border-right:1px solid var(--line)} }
.sn-brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px}
.sn-logo{display:block;width:100%;max-width:168px;height:auto}
.sn-mark{display:none;height:22px;width:auto}
.sn-brand b{display:block;font-size:15px;letter-spacing:.3px}
.sn-brand small{display:block;font-size:11.5px;opacity:.65}
.sn-sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.5;padding:6px 12px 4px}
.sn-btn{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#fff;opacity:.78;padding:11px 12px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14.5px;text-align:left}
.sn-btn:hover{opacity:1;background:rgba(255,255,255,.07)}
.sn-btn.on{opacity:1;background:rgba(255,255,255,.13);box-shadow:inset 3px 0 0 var(--orange)}
.sn-btn svg{width:19px;height:19px;flex:none}
.sn-n{margin-left:auto;background:#d6452f;color:#fff;font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;font-weight:600}
.sn-bottom{margin-top:auto;display:grid;gap:10px}
.sn-carga{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--orange);color:#fff;border:0;border-radius:10px;padding:12px 14px;font-weight:600;font-size:14.5px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sn-carga:hover{filter:brightness(1.07)}
.sn-carga.on{background:#c96d00;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
@media (prefers-color-scheme: dark){ .sn-carga{color:#1a1206} .sn-carga.on{background:#c97a1c} }
.sn-carga svg{width:18px;height:18px;flex:none}
.sn-carga{white-space:nowrap}
.sn-foot{font-size:11.5px;opacity:.6;padding:0 8px;line-height:1.4}
.shell[data-vista="carga"] nav.tabs{display:none}
.shell[data-vista="carga"] header.top{padding-bottom:18px}
.carga-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.carga-res div{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.carga-res b{display:block;font-size:17px}
.carga-res span{font-size:12px;color:var(--text-muted)}
.carga-res .ok b::before{content:'✓ ';color:var(--good)}
.carga-res .no b{color:var(--text-muted)}
.shell-main{min-width:0}
.shell[data-vista="cob"] #fin-area{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidenav{height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:4px}
  .sn-brand{padding:0 8px 0 4px} .sn-logo,.sn-sec,.sn-foot{display:none} .sn-mark{display:block}
  .sn-bottom{margin:0 0 0 auto} .sn-carga{padding:8px 12px;font-size:13.5px}
}
@media (max-width:520px){
  .sn-carga-t{display:none} .sn-carga{padding:9px 11px} .sn-btn{padding:8px 9px;gap:7px}
  .sn-btn{width:auto;padding:8px 12px}
  .sn-btn.on{box-shadow:inset 0 -3px 0 var(--orange)}
}
/* ---- Cuadro "Cobrar sí o sí" ---- */
.cobrar{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-1);padding:16px 18px 12px;margin-bottom:18px;border-top:3px solid var(--bad)}
.cobrar-h{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:8px}
.cobrar-h h2{margin:0;font-size:17px}
.cobrar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px}
@media (max-width:980px){.cobrar-grid{grid-template-columns:minmax(0,1fr)}}
.cb-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cb-rank{width:24px;height:24px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-weight:600;font-size:12px;display:grid;place-items:center}
.cb-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-meta{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-meta .t-bad{color:var(--bad);font-weight:600} .cb-meta .t-good{color:var(--good);font-weight:600}
.cb-amt{text-align:right;display:grid;justify-items:end;gap:3px}
.cb-amt b{font-family:"IBM Plex Mono",monospace;font-size:13.5px;white-space:nowrap}
.cb-dias{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--warn-bg);color:var(--warn)}
.cb-dias.hi{background:var(--bad-bg);color:var(--bad)}
.cb-acts{display:flex;gap:4px}
.btn.cb-wa{background:#1F8F55;border-color:#1F8F55;color:#fff}
.cobrar-f{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;font-size:12.5px;color:var(--text-secondary)}
</style>

<!-- ================= Módulo de Cobranzas (aislado en su propio Shadow DOM) ================= -->
<template id="cob-tpl"><style>
:host{display:block;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
[hidden]:not([hidden=until-found i]){display:none!important}
img{max-width:100%}
/* Layout: mesa de cobranza — resumen arriba, cola de clientes a la izquierda, controles y alertas a la derecha */
:host{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#141C28; --muted:#586477; --line:#D9DFE7;
  --accent:#1C4E9E; --accent-ink:#FFFFFF; --ok:#2E7A4C; --info:#2F6DB5;
  --s1:#B7791F; --s2:#D3561C; --s3:#C0262D; --s4:#7A1631; --none:#C4CCD7;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:host{
  --bg:#0E131A; --surface:#161D27; --sunk:#121821; --ink:#E5EAF1; --muted:#98A4B5; --line:#283344;
  --accent:#7FA8F2; --accent-ink:#0E131A; --ok:#5DBE84; --info:#6FA2E6;
  --s1:#E2AA4A; --s2:#F08A4B; --s3:#F2696B; --s4:#D9648A; --none:#3A4658; color-scheme:dark}}
*{box-sizing:border-box}
.cobpage{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding:20px 24px 48px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.wa{background:#1F8F55;border-color:#1F8F55;color:#fff}
.small{padding:4px 9px;font-size:12.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.repmeta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.badge.warn{color:var(--s2);border-color:color-mix(in srgb,var(--s2) 40%,transparent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px;align-content:start}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--s3)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* aging */
.aging{display:grid;gap:10px}

<script>
(function(){
const host=document.getElementById('cob-host');
const ROOT=host.attachShadow({mode:'open'});
ROOT.appendChild(document.getElementById('cob-tpl').content.cloneNode(true));
/* ---------- utilidades ---------- */
const $=s=>ROOT.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const HOY=isoLocal(new Date());
const toUTC=iso=>{const[y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)};
const diffDays=(a,b)=>Math.round((toUTC(a)-toUTC(b))/864e5);
const dmy=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`:'—';
const money=(n,m='US$')=>`${m} ${(Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const r2=n=>Math.round(n*100)/100;
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,90)||'SIN-NOMBRE';
const titleCase=s=>String(s).toLowerCase().replace(/(^|[\s(.&-])([a-záéíóúñü])/g,(m,a,b)=>a+b.toUpperCase()).replace(/ (De|Del|La|Las|Los|Y|E) /g,m=>m.toLowerCase()).replace(/\b(S\.?a\.?c|E\.?i\.?r\.?l|S\.?r\.?l|S\.?a)\b\.?/gi,m=>m.toUpperCase());
const corto=v=>titleCase(String(v).split(/\s+/).slice(0,2).join(' '));
const fin=s=>/[.!?]$/.test(s)?s:s+'.';
const LS={get(k){try{return JSON.parse(localStorage.getItem('cob_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('cob_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- lectura del Excel del sistema ---------- */
const RX_DOC=/^([A-Z]{2}\d{2}|\d{4})-\d{4,}(-\d+)?$/;
const RX_COND=/^(CONTADO|CREDITO|CRÉDITO|LETRA)/i;
function cellISO(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&v>20000&&v<80000){return new Date(Math.round((Math.floor(v)-25569)*864e5)).toISOString().slice(0,10)}
  if(v instanceof Date&&!isNaN(v))return isoLocal(v);
  if(typeof v==='string'){const m=v.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${pad(m[2])}-${pad(m[1])}`}}
  return null;
}
const numv=v=>{if(typeof v==='number')return v;if(typeof v==='string'){const n=parseFloat(v.replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n}return null};
const str=v=>v==null?'':String(v).trim();
function normMon(m){m=str(m).toUpperCase();if(!m)return 'US$';if(m.includes('US')||m.includes('$')&&!m.includes('S/'))return 'US$';return 'S/'}
function parseAOA(aoa){
  const col={doc:1,fecha:3,vcto:4,vend:8,mon:12,total:13,abono:15,saldo:18};
  let fechaRep=null,totalRep=null,cli=null;const filas=[],seen=new Set();
  for(const row of aoa){
    if(!row)continue;
    const cells=row.map(str);
    const joined=cells.join(' ');
    if(!fechaRep){const m=joined.match(/F\.\s*Imp\.\s*:\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/i);if(m)fechaRep=cellISO(m[1])}
    const iDoc=cells.indexOf('DOCUMENTO');
    if(iDoc>-1&&cells.includes('SALDO')){
      const f=n=>cells.findIndex(c=>c===n);
      if(f('FECHA')>-1)col.fecha=f('FECHA');if(f('F.VCTO')>-1)col.vcto=f('F.VCTO');if(f('VENDEDOR')>-1)col.vend=f('VENDEDOR');
      if(f('M')>-1)col.mon=f('M');if(f('TOTAL')>-1)col.total=f('TOTAL');if(f('ABONO')>-1)col.abono=f('ABONO');if(f('SALDO')>-1)col.saldo=f('SALDO');
      continue;
    }
    const iTot=cells.findIndex(c=>/^TOTAL M\.?E\.?$/i.test(c));
    if(iTot>-1){const s=numv(row[col.saldo]);if(s!=null)totalRep=s;continue}
    if(cells.some(c=>/^TOTAL M\.?N\.?$/i.test(c)))continue;
    if(cells.some(c=>/SALDO EN/i.test(c))){
      const name=cells.find(c=>c&&!/SALDO EN/i.test(c));
      const tel=cells.find((c,i)=>c&&c!==name&&/\d{3}[\s-]?\d{3}[\s-]?\d{3}/.test(c)&&!/SALDO/i.test(c))||'';
      cli={nombre:name,tel};continue;
    }
    const docIdx=cells.findIndex(c=>RX_DOC.test(c));
    if(docIdx>-1&&cli){
      const doc=cells[docIdx];
      if(seen.has(doc))continue;seen.add(doc);
      const cond=(cells.find(c=>RX_COND.test(c))||'').replace(/\s+/g,' ');
      const total=numv(row[col.total])||0,abono=numv(row[col.abono])||0;
      let saldo=numv(row[col.saldo]);if(saldo==null)saldo=total-abono;
      filas.push({cliente:cli.nombre,tel:cli.tel,doc,fecha:cellISO(row[col.fecha]),vcto:cellISO(row[col.vcto])||cellISO(row[col.fecha]),
        vendedor:cells[col.vend]||'—',cond:cond.toUpperCase().replace('CRÉDITO','CREDITO'),moneda:normMon(row[col.mon]),total:r2(total),abono:r2(abono),saldo:r2(saldo)});
    }
  }
  const suma=r2(filas.filter(f=>f.moneda==='US$').reduce((a,f)=>a+f.saldo,0));
  return {fechaReporte:fechaRep,totalReporte:totalRep,suma,cuadra:totalRep==null?null:Math.abs(suma-totalRep)<0.02,filas};
}

/* ---------- reglas de cobranza ---------- */
const ETAPAS={
  d30:{k:'d30',lbl:'Más de 30 días',sev:6,c:'--s4'},
  d16:{k:'d16',lbl:'16–30 días',sev:5,c:'--s3'},
  d8:{k:'d8',lbl:'8–15 días',sev:4,c:'--s2'},
  d1:{k:'d1',lbl:'1–7 días',sev:3,c:'--s1'},
  hoy:{k:'hoy',lbl:'Vence hoy',sev:2,c:'--info'},
  prox:{k:'prox',lbl:'Vence en 7 días',sev:1,c:'--info'},
  ok:{k:'ok',lbl:'Al día',sev:0,c:'--none'}
};
function etapa(d){return d>30?'d30':d>15?'d16':d>7?'d8':d>=1?'d1':d===0?'hoy':d>=-7?'prox':'ok'}
const BLOQUEO=15; // días de atraso a partir de los cuales se suspende el crédito

const S={rep:LS.get('rep'),gest:LS.get('gest')||{},aj:Object.assign({firma:'PASEGA S.A.C.',pago:''},LS.get('aj')||{}),hist:LS.get('hist')||[],
  filtro:'hoy',vend:'',q:'',db:null,dbState:'cargando',pending:null,dl:null,dlState:'cargando'};

function modelo(){
  if(!S.rep||!S.rep.filas)return null;
  const todos=S.rep.filas.map(f=>{const d=diffDays(HOY,f.vcto);return {...f,dias:d,et:etapa(d)}});
  const vendedores=[...new Set(todos.map(d=>d.vendedor))].sort();
  if(S.vend&&!vendedores.includes(S.vend))S.vend='';
  const docs=S.vend?todos.filter(d=>d.vendedor===S.vend):todos;
  const map=new Map();
  for(const d of docs){
    const id=slug(d.cliente);
    if(!map.has(id))map.set(id,{id,nombre:d.cliente,tel:d.tel,docs:[],total:0,venc:0,prox:0,maxD:-9999,vends:new Set(),mon:d.moneda});
    const c=map.get(id);c.docs.push(d);c.total+=d.saldo;if(d.dias>=1)c.venc+=d.saldo;else if(d.dias>=-7)c.prox+=d.saldo;
    c.maxD=Math.max(c.maxD,d.dias);c.vends.add(d.vendedor);
  }
  const clientes=[...map.values()].map(c=>{
    c.docs.sort((a,b)=>b.dias-a.dias);c.et=etapa(c.maxD);c.vends=[...c.vends];
    const g=S.gest[c.id]||{};c.g=g;if(g.tel)c.tel=g.tel;
    c.tels=String(c.tel||'').split(/[\/,;]/).map(t=>t.replace(/\D/g,'')).filter(t=>t.length>=9);
    c.bloq=c.maxD>BLOQUEO;
    const log=g.log||[];c.ult=log.length?log[log.length-1]:null;
    c.prom=g.promesa||null;
    c.promRota=!!(c.prom&&c.prom<HOY&&c.venc>0);
    c.promVig=!!(c.prom&&c.prom>=HOY);
    c.diasSinContacto=c.ult?diffDays(HOY,c.ult.fecha.slice(0,10)):null;
    return c;
  });
  const tot={total:0,venc:0,prox:0,porEtapa:{}};for(const k in ETAPAS)tot.porEtapa[k]=0;
  const soles={total:0};
  for(const d of docs){if(d.moneda!=='US$'){soles.total+=d.saldo;continue}tot.total+=d.saldo;tot.porEtapa[d.et]+=d.saldo;if(d.dias>=1)tot.venc+=d.saldo;else if(d.dias>=-7)tot.prox+=d.saldo}
  return {docs,todos,vendedores,clientes,tot,soles};
}
function enCola(c){
  if(c.et==='ok')return false;
  if(c.et==='prox'&&c.maxD<-3)return false;
  if(c.promVig)return false;
  if(c.diasSinContacto!=null&&c.diasSinContacto<2)return false;
  return true;
}

/* ---------- almacenamiento (base compartida del artifact o, si no hay, este navegador) ---------- */
const chains={};
function serial(key,fn){const p=(chains[key]||Promise.resolve()).then(fn,fn);chains[key]=p.catch(()=>{});return p}
async function guardarReporte(rep){S.rep=rep;LS.set('rep',rep);render();if(S.db)return serial('rep',()=>S.db.doc('cobranza/reporte').set(rep))}
async function guardarGestion(id,body){S.gest[id]=body;LS.set('gest',S.gest);render();if(S.db)return serial('g'+id,()=>S.db.collection('cobGestiones').doc(id).set(body))}
async function guardarAjustes(a){S.aj=a;LS.set('aj',a);render();if(S.db)return serial('aj',()=>S.db.doc('cobranza/ajustes').set(a))}
async function guardarHist(h){const id=h.fechaReporte+'_'+h.cargadoEn.replace(/[^0-9]/g,'').slice(0,14);S.hist=[...S.hist.filter(x=>x.id!==id),{...h,id}];LS.set('hist',S.hist);render();if(S.db)return serial('h',()=>S.db.collection('cobHistorial').doc(id).set({...h,id}))}
function conectar(){
  if(!window.claude||!window.claude.use){S.dbState='local';S.dlState='no';render();return}
  window.claude.use('downloads').then(d=>{S.dl=d;S.dlState=d?'ok':'no';render()}).catch(()=>{S.dlState='no';render()});
  window.claude.use('db').then(db=>{
    if(!db){S.dbState='local';render();return}
    S.db=db;S.dbState='ok';
    const err=e=>{console.warn(e);S.dbState='error';render()};
    db.doc('cobranza/reporte').onSnapshot(s=>{if(s.exists){S.rep=s.data();LS.set('rep',S.rep)}S.repListo=true;render()},err);
    db.collection('cobGestiones').onSnapshot(q=>{const g={};q.docs.forEach(d=>g[d.id]=d.data());S.gest=g;LS.set('gest',g);render()},err);
    db.doc('cobranza/ajustes').onSnapshot(s=>{if(s.exists){S.aj=Object.assign({firma:'PASEGA S.A.C.',pago:''},s.data());LS.set('aj',S.aj)}render()},err);
    db.collection('cobHistorial').onSnapshot(q=>{S.hist=q.docs.map(d=>d.data());LS.set('hist',S.hist);render()},err);
    render();
  }).catch(()=>{S.dbState='local';render()});
}

/* ---------- carga de un reporte nuevo ---------- */
function leerArchivo(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      if(!window.XLSX)throw new Error('No se pudo cargar el lector de Excel. Revisa tu conexión y vuelve a intentar.');
      const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
      const p=parseAOA(aoa);
      if(!p.filas.length)throw new Error('No encontré documentos en este archivo. Usa el reporte "Estado de cuenta cliente" exportado a Excel desde tu sistema.');
      prepararCarga(p,file.name);
    }catch(e){banner('err',esc(e.message||String(e)))}
  };
  fr.readAsArrayBuffer(file);
}
function prepararCarga(p,nombre){
  const rep={fechaReporte:p.fechaReporte||HOY,cargadoEn:new Date().toISOString(),archivo:nombre,totalReporte:p.totalReporte,suma:p.suma,cuadra:p.cuadra,filas:p.filas};
  const prev=S.rep;
  if(prev&&prev.fechaReporte&&rep.fechaReporte<prev.fechaReporte){
    S.pending=rep;
    banner('warn',`Este reporte es del <b>${dmy(rep.fechaReporte)}</b>, más antiguo que el que ya tienes (${dmy(prev.fechaReporte)}). ¿Reemplazar de todos modos?`,
      `<button class="primary small" type="button" data-act="confirmar">Reemplazar</button><button class="small" type="button" data-act="cerrarBanner">Cancelar</button>`);
    return;
  }
  aplicarCarga(rep);
}
function aplicarCarga(rep){
  const prev=S.rep;
  const h={fechaReporte:rep.fechaReporte,cargadoEn:rep.cargadoEn,cartera:0,vencido:0,docs:rep.filas.length,cobrado:0,abonos:0,nuevos:0,montoNuevo:0,cobradosLista:[]};
  for(const f of rep.filas){if(f.moneda!=='US$')continue;h.cartera+=f.saldo;if(diffDays(rep.fechaReporte,f.vcto)>=1)h.vencido+=f.saldo}
  if(prev&&prev.filas){
    const nuevo=new Map(rep.filas.map(f=>[f.doc,f]));const viejo=new Map(prev.filas.map(f=>[f.doc,f]));
    for(const [doc,f] of viejo){const n=nuevo.get(doc);
      if(!n){h.cobrado+=f.saldo;h.cobradosLista.push({cliente:f.cliente,doc,monto:f.saldo})}
      else if(n.saldo<f.saldo-0.005){h.abonos+=f.saldo-n.saldo}}
    for(const [doc,f] of nuevo){if(!viejo.has(doc)){h.nuevos++;h.montoNuevo+=f.saldo}}
  }
  ['cartera','vencido','cobrado','abonos','montoNuevo'].forEach(k=>h[k]=r2(h[k]));
  h.cobradosLista=h.cobradosLista.slice(0,60);
  h.primero=!prev;
  S.pending=null;
  guardarReporte(rep).catch(e=>banner('err','No se pudo guardar el reporte en la base compartida: '+esc(e.code||e.message)));
  guardarHist(h).catch(()=>{});
  const ok=rep.cuadra===true?`Cuadra con el total del reporte (${money(rep.totalReporte)}).`:rep.cuadra===false?`<b>Ojo:</b> la suma leída (${money(rep.suma)}) no coincide con el total del reporte (${money(rep.totalReporte)}). Revisa que el archivo esté completo.`:'';
  banner(rep.cuadra===false?'warn':'',`Reporte del <b>${dmy(rep.fechaReporte)}</b> cargado: ${rep.filas.length} documentos. ${ok}`+
    (prev?` Desde el reporte anterior: cobrado ${money(h.cobrado)}, abonos ${money(h.abonos)}, ${h.nuevos} documentos nuevos.`:''));
}

const EMPRESA=/\b(S\.?A\.?C|E\.?I\.?R\.?L|S\.?R\.?L|S\.?A\.?)\b|EMPRESA|CORPORACION|COMERCIAL|IMPORT|REPUESTOS|INVERSIONES|NEGOCIACIONES|HIDRAULICAS|MOTORS|AUTOMOTRIZ|DIPERBAT|COMPANY/i;
function saludo(c){const n=titleCase(c.nombre.replace(/\(.*?\)/g,'').trim());return fin(EMPRESA.test(c.nombre)?`Buen día, estimados de ${n}`:`Buen día, ${n}`)}
function mensaje(c){
  const firma=S.aj.firma||'PASEGA S.A.C.',de=fin('Le escribimos de '+firma);
  const venc=c.docs.filter(d=>d.dias>=1);let prox=c.docs.filter(d=>d.dias<=0&&d.dias>=-7);
  if(!venc.length&&!prox.length)prox=c.docs.slice().sort((a,b)=>b.dias-a.dias);
  const sumProx=prox.reduce((a,d)=>a+d.saldo,0);
  const linea=d=>`• ${d.doc} · ${money(d.saldo,d.moneda)} · ${d.dias>=1?`venció el ${dmy(d.vcto)} (${d.dias} ${d.dias===1?'día':'días'})`:d.dias===0?'vence hoy':`vence el ${dmy(d.vcto)}`}`;
  const pago=S.aj.pago?`\n\n${S.aj.pago}`:'';
  const s=saludo(c);
  if(!venc.length){
    return `${s} Le escribimos de ${firma} para recordarle ${prox.length>1?'los siguientes vencimientos':'el siguiente vencimiento'}:\n${prox.map(linea).join('\n')}\nTotal: ${money(sumProx)}.\n\nSi ya realizó el pago, por favor envíenos la constancia. ¡Gracias!${pago}`;
  }
  const extra=prox.length?`\n\nAdemás, próximamente vence:\n${prox.map(linea).join('\n')}`:'';
  if(c.et==='d1'){
    return `${s} ${de} Según nuestro registro, tiene pendiente de pago:\n${venc.map(linea).join('\n')}\nTotal vencido: ${money(c.venc)}.${extra}\n\n¿Nos podría confirmar la fecha en que realizará el pago? Si ya pagó, envíenos la constancia para actualizar su cuenta. Gracias.${pago}`;
  }
  if(c.et==='d8'){
    return `${s} ${de} Su cuenta presenta un atraso de ${c.maxD} días:\n${venc.map(linea).join('\n')}\nTotal vencido: ${money(c.venc)}.${extra}\n\nLe pedimos regularizar a la brevedad o indicarnos una fecha de pago. Quedamos atentos.${pago}`;
  }
  return `${s} ${de} Su cuenta presenta un atraso de ${c.maxD} días en los siguientes documentos:\n${venc.map(linea).join('\n')}\nTotal vencido: ${money(c.venc)}.${extra}\n\nPara seguir atendiendo sus pedidos a crédito necesitamos regularizar este saldo. Por favor confírmenos hoy una fecha de pago. Quedamos atentos.${pago}`;
}

function filtrar(M){

function datosAlertas(M){

  const bol=D.filter(d=>d.doc.startsWith('BE')&&d.cond!=='CONTADO');
  if(bol.length)A.push({t:'Crédito con boleta',m:bol.reduce((a,d)=>a+d.saldo,0),p:'Crédito a personas sin RUC. Es más difícil de cobrar y de respaldar.',l:bol.map(d=>`${d.cliente} · ${money(d.saldo)} · ${d.dias>=1?d.dias+' días de atraso':'al día'}`)});
  const rotas=C.filter(c=>c.promRota);
  if(rotas.length)A.push({t:'Promesas de pago incumplidas',m:rotas.reduce((a,c)=>a+c.venc,0),p:'Prometieron una fecha que ya pasó.',l:rotas.map(c=>`${c.nombre} · prometió ${dmy(c.prom)}`)});
  const letras=D.filter(d=>d.cond.startsWith('LETRA')&&d.dias>=1);
  if(letras.length)A.push({t:'Letras vencidas',m:letras.reduce((a,d)=>a+d.saldo,0),p:'Revisa con tu banco o notaría si corresponde protestarlas. El plazo para hacerlo es corto.',l:letras.sort((a,b)=>b.dias-a.dias).map(d=>`${d.cliente} · ${d.doc} · ${d.dias} días`)});
  const sintel=C.filter(c=>!c.tels.length&&c.et!=='ok');
  if(sintel.length)A.push({t:'Deudores sin teléfono',m:sintel.reduce((a,c)=>a+c.venc+c.prox,0),p:'No se les puede escribir. Agrega el número en "Registrar gestión" o en tu sistema.',l:sintel.map(c=>`${c.nombre}${c.venc>0?' · '+money(c.venc)+' vencido':''}`)});
  const conc=C.filter(c=>c.total/M.tot.total>0.08);
  if(conc.length)A.push({t:'Concentración de cartera',m:null,p:'Clientes que pesan más del 8% de todo lo que te deben.',l:conc.sort((a,b)=>b.total-a.total).map(c=>`${c.nombre} · ${(c.total/M.tot.total*100).toFixed(1)}%`)});
  return A;
}

function porVendedor(M){

function textoBloqueo(L){return `Clientes con crédito suspendido (más de ${BLOQUEO} días de atraso) al ${dmy(HOY)}:\n`+L.map(c=>`- ${c.nombre} · ${money(c.venc)} vencido · ${c.maxD} días`).join('\n')+`\n\nNo vender a crédito hasta que regularicen.`}
function bloqueados(M){
  const L=M.clientes.filter(c=>c.bloq).sort((a,b)=>b.maxD-a.maxD);
  return `<section class="panel pad sblock"><div class="crow" style="margin-bottom:10px"><h2>No dar crédito</h2>${L.length?'<button class="small" type="button" data-act="copiarBloq">Copiar lista</button>':''}</div>${L.length?`<table class="tbl"><tbody>${L.map(c=>`<tr><td>${esc(c.nombre)}</td><td>${c.maxD} d</td></tr>`).join('')}</tbody></table><p class="note" style="margin:8px 0 0">Copia la lista y envíala a tus vendedores y a oficina.</p>`:'<p class="muted" style="margin:0">Nadie supera los '+BLOQUEO+' días de atraso.</p>'}</section>`;
}
function historial(){
  const H=[...S.hist].sort((a,b)=>(b.cargadoEn||'').localeCompare(a.cargadoEn||'')).slice(0,8);
  if(!H.length)return '';
  return `<section class="panel pad sblock"><h2>Semana a semana</h2><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Reporte</th><th>Cartera</th><th>Vencido</th><th>Cobrado</th></tr></thead><tbody>${H.map(h=>{const p=h.cartera?h.vencido/h.cartera*100:0;return `<tr><td>${dmy(h.fechaReporte)}</td><td>${money(h.cartera).replace('US$ ','')}</td><td><span class="pct ${p>=25?'hi':''}">${p.toFixed(0)}%</span></td><td>${h.primero?'—':money(h.cobrado+h.abonos).replace('US$ ','')}</td></tr>`}).join('')}</tbody></table></div><p class="note" style="margin:8px 0 0">"Cobrado" son los documentos que desaparecieron del reporte más los abonos, comparado con el reporte anterior.</p></section>`;
}

/* ---------- descarga a Excel ---------- */
const filtroTxt=()=>({hoy:'Toca hoy',venc:'Vencidos',prox:'Vencen en 7 días',prom:'Con promesa',bloq:'Crédito suspendido',todos:'Todos'}[S.filtro]||ETAPAS[S.filtro.slice(2)]?.lbl||S.filtro);
const xDate=iso=>iso?(toUTC(iso)-Date.UTC(1899,11,30))/864e5:null; // número de serie de Excel
const fmtCols=(ws,cols,z,desde=1)=>{const g=XLSX.utils.decode_range(ws['!ref']);for(let r=desde;r<=g.e.r;r++)for(const c of cols){const x=ws[XLSX.utils.encode_cell({r,c})];if(x&&x.t==='n')x.z=z}};
// arma una hoja: nums = columnas con formato de monto, fechas, pct
function hoja(wb,nombre,aoa,{anchos=[],nums=[],fechas=[],pct=[],filtro=false,desde=1}={}){
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  if(ws['!ref']){fmtCols(ws,fechas,'dd/mm/yyyy',desde);fmtCols(ws,nums,'#,##0.00',desde);fmtCols(ws,pct,'0.0%',desde)}
  ws['!cols']=anchos.map(w=>({wch:w}));
  if(filtro&&aoa.length>1){const g=XLSX.utils.decode_range(ws['!ref']);g.s.r=desde-1;ws['!autofilter']={ref:XLSX.utils.encode_range(g)}}
  XLSX.utils.book_append_sheet(wb,ws,nombre);
}
const HEAD_DOC=['Cliente','Teléfono','Vendedor','Documento','Condición','Emisión','Vence','Días de atraso','Situación','Moneda','Saldo','Crédito suspendido','Última gestión','Fecha gestión','Nota','Promete pagar'];
const ANCHO_DOC=[44,14,30,17,14,11,11,9,16,7,11,10,20,11,36,12];
function filasDoc(L){
  const rows=[HEAD_DOC];
  for(const c of L)for(const d of c.docs)rows.push([c.nombre,c.tel||'',d.vendedor,d.doc,d.cond,xDate(d.fecha),xDate(d.vcto),d.dias>0?d.dias:0,ETAPAS[d.et].lbl,d.moneda,d.saldo,c.bloq?'Sí':'No',
    c.ult?tipoTxt(c.ult.tipo):'',c.ult?xDate(c.ult.fecha.slice(0,10)):null,c.ult?c.ult.nota||'':'',c.prom?xDate(c.prom):null]);
  return rows;
}
function libro(M,L){
  const wb=XLSX.utils.book_new(),t=M.tot;
  // 1. Resumen: lo que se ve arriba del panel
  const nv=M.clientes.filter(c=>c.venc>0).length,nb=M.clientes.filter(c=>c.bloq).length;
  const tramos=[['Al día','ok'],['Vence en 7 días o menos',['prox','hoy']],['1–7 días de atraso','d1'],['8–15 días de atraso','d8'],['16–30 días de atraso','d16'],['Más de 30 días de atraso','d30']];
  const res=[['PASEGA S.A.C. · Panel de cobranzas'],[],
    ['Estado de cuenta del',xDate(S.rep.fechaReporte)],['Descargado el',xDate(HOY)],['Vendedor',S.vend||'Todos'],[],
    ['Indicador','Valor'],
    ['Por cobrar US$',r2(t.total)],['Clientes',M.clientes.length],['Documentos',M.docs.length],
    ['Vencido US$',r2(t.venc)],['% vencido',t.total?t.venc/t.total:0],['Clientes con deuda vencida',nv],
    ['Vence en 7 días US$',r2(t.prox)],[`Clientes con crédito suspendido (más de ${BLOQUEO} días)`,nb]];
  if(M.soles.total)res.push(['Por cobrar S/ (aparte)',r2(M.soles.total)]);
  res.push([],['Antigüedad de la deuda','Monto US$','% del total']);
  for(const [l,k] of tramos){const v=[].concat(k).reduce((a,x)=>a+t.porEtapa[x],0);res.push([l,r2(v),t.total?v/t.total:0])}
  const ws=XLSX.utils.aoa_to_sheet(res);
  for(let r=0;r<res.length;r++){
    const lab=String(res[r][0]||''),b=ws[XLSX.utils.encode_cell({r,c:1})],c2=ws[XLSX.utils.encode_cell({r,c:2})];
    if(!b||b.t!=='n')continue;
    if(/^(Estado de cuenta|Descargado)/.test(lab))b.z='dd/mm/yyyy';
    else if(/US\$|S\/|^(Al día|Vence en 7 días o|\d|Más de)/.test(lab))b.z='#,##0.00';
    else if(/^%/.test(lab))b.z='0.0%';
    if(c2&&c2.t==='n')c2.z='0.0%';
  }
  ws['!cols']=[{wch:44},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'Resumen');
  // 2. Cola tal como se ve (filtro y búsqueda)
  const cola=filasDoc(L);
  cola.unshift([`Cola de cobranza · Filtro: ${filtroTxt()} · Vendedor: ${S.vend||'Todos'}${S.q?' · Búsqueda: '+S.q:''}`],[]);
  hoja(wb,'Cola de cobranza',cola,{anchos:ANCHO_DOC,nums:[10],fechas:[5,6,13,15],filtro:true,desde:3});
  // 3. Todos los documentos de la cartera
  hoja(wb,'Documentos',filasDoc([...M.clientes].sort((a,b)=>b.maxD-a.maxD||b.total-a.total)),{anchos:ANCHO_DOC,nums:[10],fechas:[5,6,13,15],filtro:true});
  // 4. Por vendedor (todos los vendedores, como en el panel)
  const V={};for(const d of M.todos){if(d.moneda!=='US$')continue;const v=V[d.vendedor]||(V[d.vendedor]={c:0,v:0,cl:new Set(),cv:new Set()});v.c+=d.saldo;v.cl.add(d.cliente);if(d.dias>=1){v.v+=d.saldo;v.cv.add(d.cliente)}}
  const vr=[['Vendedor','Cartera US$','Vencido US$','% vencido','Clientes','Clientes con deuda vencida']];
  Object.entries(V).sort((a,b)=>b[1].v-a[1].v||b[1].c-a[1].c).forEach(([n,v])=>vr.push([n,r2(v.c),r2(v.v),v.c?v.v/v.c:0,v.cl.size,v.cv.size]));
  hoja(wb,'Por vendedor',vr,{anchos:[34,13,13,10,10,24],nums:[1,2],pct:[3]});
  // 5. Alertas de control
  const al=[['Alerta','Monto US$','Qué significa','Detalle']];
  for(const a of datosAlertas(M))a.l.forEach((x,i)=>al.push([a.t,i===0&&a.m!=null?r2(a.m):null,i===0?a.p:'',x]));
  if(al.length===1)al.push(['Sin alertas']);
  hoja(wb,'Alertas',al,{anchos:[30,12,60,60],nums:[1]});
  // 6. No dar crédito
  const nb2=[['Cliente','Teléfono','Vendedor','Vencido US$','Días de atraso','Promete pagar']];
  M.clientes.filter(c=>c.bloq).sort((a,b)=>b.maxD-a.maxD).forEach(c=>nb2.push([c.nombre,c.tel||'',c.vends.join(', '),r2(c.venc),c.maxD,c.prom?xDate(c.prom):null]));
  hoja(wb,'No dar crédito',nb2,{anchos:[44,14,30,12,10,12],nums:[3],fechas:[5]});
  // 7. Gestiones registradas
  const nombres=new Map(M.clientes.map(c=>[c.id,c.nombre]));
  const gs=[['Cliente','Fecha','Tipo','Nota','Promete pagar']];
  for(const [id,g] of Object.entries(S.gest)){
    const n=nombres.get(id);if(!n&&S.vend)continue; // con filtro de vendedor, solo sus clientes
    for(const l of g.log||[])gs.push([n||g.cliente||id,xDate(l.fecha.slice(0,10)),tipoTxt(l.tipo),l.nota||'',l.promesa?xDate(l.promesa):null]);
  }
  gs.splice(1,gs.length,...gs.slice(1).sort((a,b)=>(b[1]||0)-(a[1]||0)));
  hoja(wb,'Gestiones',gs,{anchos:[44,11,22,60,12],fechas:[1,4],filtro:true});
  // 8. Semana a semana (toda la cartera)
  const H=[...S.hist].sort((a,b)=>(a.fechaReporte||'').localeCompare(b.fechaReporte||''));
  const hs=[['Reporte del','Cartera US$','Vencido US$','% vencido','Cobrado US$','Abonos US$','Documentos nuevos','Monto nuevo US$']];
  H.forEach(h=>hs.push([xDate(h.fechaReporte),h.cartera,h.vencido,h.cartera?h.vencido/h.cartera:0,h.primero?null:h.cobrado,h.primero?null:h.abonos,h.primero?null:h.nuevos,h.primero?null:h.montoNuevo]));
  hoja(wb,'Semana a semana',hs,{anchos:[12,13,13,10,13,12,12,14],fechas:[0],nums:[1,2,4,5,7],pct:[3]});
  return wb;
}
async function descargar(btn){
  const M=modelo();if(!M)return;const L=filtrar(M);
  if(!window.XLSX){toast('No se pudo cargar el generador de Excel. Revisa tu conexión a internet.');return}
  const nombre=`Panel cobranzas ${S.vend?corto(S.vend):'todos'} ${dmy(HOY).replace(/\//g,'-')}.xlsx`;
  btn.disabled=true;
  try{
    const wb=libro(M,L);
    // dentro de claude.ai se usa el permiso de descargas; abierto como archivo, la descarga normal del navegador
    let dl=S.dl;
    if(!dl&&window.claude&&window.claude.use)dl=await window.claude.use('downloads').catch(()=>null);
    if(dl){
      const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      await dl.save({filename:nombre,data:new Blob([buf])});
    }else{
      XLSX.writeFile(wb,nombre);
    }
    toast('Excel descargado');
  }catch(e){
    const code=e&&e.code;
    if(code==='declined'){}
    else if(code==='rate_limited')toast('Ya hay una descarga esperando tu confirmación.');
    else toast('No se pudo descargar: '+(e&&e.message||code||'error'));
  }finally{btn.disabled=false}
}

async function guardarArchivo(nombre,blob,fallback){
  // dentro de claude.ai se usa el permiso de descargas; abierto como archivo, la descarga normal del navegador
  let dl=S.dl;
  if(!dl&&window.claude&&window.claude.use)dl=await window.claude.use('downloads').catch(()=>null);
  if(dl)await dl.save({filename:nombre,data:blob});else fallback();
}

<script>
/* ============ Lector de comprobantes (plantilla Crystal Reports de Pasega) ============ */
const MESES = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
const numP = s => parseFloat(String(s).replace(/,/g,''));
const norm = s => String(s||'').toUpperCase().replace(/\s+/g,' ').trim();

function parsePages(pages){
  const all = pages.flatMap(p=>p.items);
  const text = all.map(i=>i.str).join(' \n');
  const out = {doc:'',tipo:'',fecha:'',cliente:'',ruc:'',vendedor:'',moneda:'',subtotal:null,igv:null,total:null,ref:'',items:[],avisos:[]};
  const m1 = text.match(/\b([FB][EC]\d{2})-(\d{1,8})\b/);
  if(m1) out.doc = m1[1]+'-'+m1[2].padStart(8,'0');
  const up = norm(text);
  out.tipo = (/NOTA\s+DE\s+CR[EÉ]DITO/.test(up) || /^[FB]C/.test(out.doc)) ? 'NC' : (/BOLETA/.test(up) || /^BE/.test(out.doc)) ? 'BOLETA' : 'FACTURA';
  if(out.tipo==='NC'){
    const refs = [...text.matchAll(/\b([FB]E\d{2})-(\d{1,8})\b/g)].map(m=>m[1]+'-'+m[2].padStart(8,'0')).filter(d=>d!==out.doc);
    if(refs.length) out.ref = refs[0];
  }
  const md = text.match(/(\d{1,2})\s+de\s+([A-Za-zñÑ]+)\s+de\s+(\d{4})/i);
  if(md && MESES[md[2].toLowerCase()]) out.fecha = `${md[3]}-${String(MESES[md[2].toLowerCase()]).padStart(2,'0')}-${md[1].padStart(2,'0')}`;
  else { const md2 = text.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(md2) out.fecha = `${md2[3]}-${md2[2]}-${md2[1]}`; }

  for(const pg of pages){
    const its = pg.items;
    const sameRow = (lab,minX) => its.filter(i=>Math.abs(i.y-lab.y)<=3 && i.x>minX && i.str.trim() && i.str.trim()!==':').sort((a,b)=>a.x-b.x);
    const find = re => its.find(i=>re.test(i.str));
    const lv = find(/^\s*VENDEDOR\s*$/i);
    if(lv && !out.vendedor){ const r = sameRow(lv, lv.x+30); if(r.length) out.vendedor = norm(r.map(i=>i.str).join(' ')); }
    const lc = find(/^\s*Señor\(es\)/i);
    if(lc && !out.cliente){ const r = sameRow(lc, lc.x+50).filter(i=>i.x<400); if(r.length) out.cliente = norm(r.map(i=>i.str).join(' ')); }
    for(const l of its.filter(i=>/R\.U\.C\.\s*$/.test(i.str.trim()) || /^D\.?N\.?I\.?$/.test(i.str.trim()))){
      if(out.ruc) break; const r = sameRow(l, l.x+30).filter(i=>/^\d{8,11}$/.test(i.str.trim())); if(r.length) out.ruc = r[0].str.trim();
    }
    for(const [key,re] of [['subtotal',/SUB-?TOTAL/i],['igv',/I\.?G\.?V/i],['total',/^\s*TOTAL\s*$/i]]){
      const l = find(re); if(!l || out[key]!==null) continue;
      const r = sameRow(l, l.x+20);
      const cur = r.find(i=>/US\$|S\/|\$/.test(i.str)); if(cur && !out.moneda) out.moneda = /US/.test(cur.str)?'USD':'PEN';
      const n = r.filter(i=>/^[\d,]+\.\d+$/.test(i.str.trim())); if(n.length) out[key] = numP(n[n.length-1].str);
    }
    const hCod = find(/^\s*C[OÓ]DIGO\s*$/i), hCant = find(/^\s*CANT/i), hUni = find(/^\s*UNIDAD\s*$/i), hVU = find(/UNITARIO/i), hVV = its.find(i=>/^\s*VENTA\s*$/i.test(i.str));
    if(!hCod || !hCant) continue;
    const top = Math.min(hCod.y,hCant.y) - 4;
    const stop = its.filter(i=>/^\s*SON\s*:|SUB-?TOTAL/i.test(i.str) && i.y<top).reduce((a,i)=>Math.max(a,i.y), -1);
    const bCodCant = hCant.x - 6, bCantUni = hUni ? hUni.x-8 : hCant.x+37, bUniDesc = hUni ? hUni.x+38 : hCant.x+83;
    const bDescNum = hVU ? hVU.x-6 : 470, bVuVv = hVV ? hVV.x-4 : 528;
    const body = its.filter(i=>i.y<top && i.y>stop+3 && i.str.trim()).sort((a,b)=>b.y-a.y || a.x-b.x);
    const rows = []; for(const i of body){ const r = rows.find(r=>Math.abs(r.y-i.y)<=3); if(r) r.items.push(i); else rows.push({y:i.y,items:[i]}); }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){
      const o = {n:'',codigo:'',cant:'',unidad:'',descripcion:'',vu:'',vv:''};
      for(const i of r.items.sort((a,b)=>a.x-b.x)){
        const s = i.str.trim(), end = i.x+(i.w||0);
        if(i.x < hCod.x-20 && /^\d{1,3}$/.test(s) && !o.n) o.n = s;
        else if(i.x < bCodCant) o.codigo += (o.codigo?' ':'')+s;
        else if(i.x < bCantUni) o.cant += s;
        else if(i.x < bUniDesc) o.unidad += (o.unidad?' ':'')+s;
        else if(i.x < bDescNum) o.descripcion += (o.descripcion?' ':'')+s;
        else if(end < bVuVv) o.vu += s;
        else o.vv += s;
      }
      const isItem = /^[\d,]+(\.\d+)?$/.test(o.cant) && /^[\d,]+\.\d+$/.test(o.vv);
      if(isItem) out.items.push({codigo:norm(o.codigo), cant:numP(o.cant), unidad:norm(o.unidad), descripcion:norm(o.descripcion), vu:numP(o.vu)||0, vv:numP(o.vv)});
      else if(out.items.length && (o.descripcion||o.codigo) && !o.vv){
        const last = out.items[out.items.length-1];
        if(o.descripcion) last.descripcion = norm(last.descripcion+' '+o.descripcion);
        if(o.codigo && !/^\d{1,3}$/.test(o.codigo)) last.codigo = norm(last.codigo+' '+o.codigo);
      }
    }
  }
  const suma = out.items.reduce((a,i)=>a+i.vv,0);
  out.suma = Math.round(suma*100)/100;
  out.cuadra = out.subtotal!==null && Math.abs(suma-out.subtotal) < 0.05;
  if(!out.doc) out.avisos.push('No se encontró el número de comprobante');
  if(!out.fecha) out.avisos.push('No se encontró la fecha');

    for(const sn of wb.SheetNames){ const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:''}); const r = parseCompraHoja(rows); if(!mejor || r.lineas.length > mejor.lineas.length) mejor = r; }

  }

    const its = tc.items.filter(i=>i.str && i.str.trim());

    const rot = its.filter(i=>Math.abs(i.transform[1])>Math.abs(i.transform[0])).length > its.length/2;

  }
  try{ doc.destroy(); }catch(e){}
  if(!pages.some(p=>p.items.length)) throw new Error('Este PDF es una imagen escaneada (una foto del documento): no tiene texto que se pueda leer. Pide al proveedor la factura en Excel o en PDF digital, o copia las líneas con "Pegar desde Excel".');
  return parseGenericPdf(pages);
}

    comprasRes.push({id:c.id, nombre:c.nombre||'', fecha:c.fecha, tipo:c.tipo||'importacion', proveedor:c.proveedor, ref:c.ref, estado:c.estado, n:k.valid.filter(Boolean).length, valor:k.tv, pagado:k.pagado, gastos:k.tg+k.dif, total:k.total, factor:k.tv?k.factor:null, margen:c.margen, ventaProy:k.ventaProy, impuestos:k.impuestos, desembolso:k.desembolso, pagoPend:k.pagoPend, saldo:k.saldo, abonado:k.abonado, pagoVence:c.pagoVence||''});
  }
  Object.values(costo).forEach(o=>o.cu = o.cant ? o.usd/o.cant : null);

    const aplic = (CR && CR.p) ? CR.p : variantes[k] ? (Object.keys(variantes[k]).map(v=>v.split(' · ').pop()).find(esAplicacion) || '') : '';
    cat[k] = {key:k, name, autoName:auto, code, aplic, esCodigo: !!code, cat:ct, famId, famLab, catManual: !!catMap[k] || !!(CR && CR.k), enCatalogo: !!CR, manual:{n:!!nomMap[k], f:!!famMap[k], k:!!catMap[k]}, variantes: variantes[k] ? Object.keys(variantes[k]) : []};
  }

  const pref = c => { const m = deacc(c.code||'').match(/^[A-Z]{2,}/); return m ? m[0].slice(0,4) : ''; };
  const votos = {}; Object.values(cat).forEach(c=>{ const p = pref(c); if(!p || c.cat==='Otros' || c.key===NC_SIN) return; (votos[p] ||= {}); votos[p][c.cat] = (votos[p][c.cat]||0)+1; });
  Object.values(cat).forEach(c=>{
    if(c.cat==='Otros' && !c.catManual){ for(const p of [pref(c), pref(c).slice(0,3), pref(c).slice(0,2)]){ const v = p && votos[p]; if(!v) continue; const [best, n] = Object.entries(v).sort((a,b)=>b[1]-a[1])[0]; const tot = Object.values(v).reduce((a,b)=>a+b,0); if((n>=2 && n/tot>=0.8) || (n===tot && n>=1)){ c.cat = best; c.catPorCodigo = true; break; } } }
    // Si la descripción solo trae la aplicación (TOYOTA | HIACE…), el nombre es "tipo de producto + código"
    if(!nomMap[c.key] && !(c.enCatalogo && catalogo[c.key].n) && c.code && (c.name===c.code || esAplicacion(c.name))){ const et = etiquetaCat(c.cat); c.name = (et ? et+' ' : '') + c.code; c.autoName = c.name; }
  });
  // Grupos fuera de catálogo a propósito: no cuentan como faltantes y forman su propia familia
  const FG = fueraGrupos().map(g=>({n:g.n, k:g.k.map(x=>deacc(x).replace(/\s+/g,' ').trim()).filter(Boolean)}));
  Object.values(cat).forEach(c=>{ if(c.enCatalogo || c.key===NC_SIN) return; const txt = deacc([c.code, c.name, ...c.variantes].join(' ')).replace(/\s+/g,' ');
    const g = FG.find(g=>g.k.some(k=>txt.includes(k))); if(g){ c.fueraIntencional = g.n; if(!famMap[c.key]){ c.famId = 'U:'+norm(g.n); c.famLab = norm(g.n); } } });
  const famVotes = {}; Object.values(cat).forEach(c=>{ (famVotes[c.famId] ||= {}); famVotes[c.famId][c.famLab] = (famVotes[c.famId][c.famLab]||0)+1; });
  const famName = {}; for(const [id,vs] of Object.entries(famVotes)) famName[id] = Object.entries(vs).sort((a,b)=>b[1]-a[1])[0][0];
  Object.values(cat).forEach(c=>c.fam = famName[c.famId]);
  lines.forEach(l=>{ const c = cat[l.key]; l.fam = c ? c.fam : l.key; l.cat = c ? c.cat : 'Otros'; });
  // Colores de categoría: fijos por ranking histórico (no cambian con los filtros)
  const catTot = {}; lines.forEach(l=>{ if(l.key!==NC_SIN) catTot[l.cat]=(catTot[l.cat]||0)+l.usd; });
  const catRank = Object.entries(catTot).filter(([c])=>c!=='Otros').sort((a,b)=>b[1]-a[1]).map(([c])=>c);
  const catColor = {}; catRank.slice(0,7).forEach((c,i)=>catColor[c]=`var(--series-${i+1})`);
  const catList = [...new Set([...cats().map(c=>c.n), ...Object.values(cat).map(c=>c.cat)])].filter(c=>Object.values(cat).some(x=>x.cat===c));
  const meses = [...new Set(lines.map(l=>l.mes))].sort();
  const vendedores = [...new Set(lines.map(l=>l.vend))].sort();
  // Para leer facturas de compra: código del proveedor + descripción → producto del catálogo
  const buscarCat = (cod, desc) => { if(!ck.length) return null; const noA = aj.noAuto||{};
    const c = compact(cod||''); if(c && noA[c]) return null;
    if(c){ const m = looksCode(cod) || /\d/.test(c) ? matchCodigo(cod) : null; if(m) return {k:m.hit, como:m.como}; }
    const hits = [...new Set([...partes((cod||'')+' '+(desc||'')).M].map(enCat).filter(Boolean))]; if(hits.length===1) return {k:hits[0], como:'modelo dentro del nombre'};

}
function filtrar(D, ignoreCat){
  const f = S.f;
  return D.lines.filter(l => (!f.ini || l.fecha>=f.ini) && (!f.fin || l.fecha<=f.fin) && (!f.vend || l.vend===f.vend) && (ignoreCat || !f.cat || l.cat===f.cat));
}
const valN = l => S.f.cur==='USD' ? l.usd : l.pen;   // siempre sin IGV (rentabilidad y comisiones)
const val = l => valN(l) * (S.f.igv ? (l.fi||1.18) : 1);
function group(lines, kf){
  const m = new Map();
  for(const l of lines){ const k = kf(l); let o = m.get(k); if(!o){ o={k,monto:0,cant:0,docs:new Set(),nc:0}; m.set(k,o); } o.monto += val(l); o.cant += l.cant; if(l.tipo!=='NC') o.docs.add(l.doc); else o.nc += val(l); }
  return m;
}
function stockInfo(D){
  const lead = +S.ajustes.lead || 3;
  const hoy = today(), d90 = new Date(Date.now()-90*86400000).toISOString().slice(0,10);
  const vend90 = {}, vendTot = {};
  const porKey = {};
  D.linesAll.forEach(l=>{ if(l.fecha>d90) vend90[l.key]=(vend90[l.key]||0)+l.cant; vendTot[l.key]=(vendTot[l.key]||0)+l.cant; (porKey[l.key] ||= []).push(l); });
  const out = {};
  for(const k of Object.keys(D.cat)){
    if(k===NC_SIN) continue;
    const st = D.stock[k];
    const avg = (vend90[k]||0)/3;
    let est = null, vendDesde = 0, compDesde = 0;
    if(st && st.cant!=null && st.cant!==''){
      (porKey[k]||[]).forEach(l=>{ if(l.fecha>(st.fecha||'')) vendDesde += l.cant; });
      (D.comprasPorKey[k]||[]).forEach(c=>{ if(c.estado!=='provisional' && c.estado!=='transito' && (c.fecha||'')>(st.fecha||'')) compDesde += c.cant; });
      est = (+st.cant) - vendDesde + compDesde;
    }
    const cob = (est!=null && avg>0) ? est/avg : null;
    let estado = 'sin', lab = 'Sin conteo';
    if(est!=null){
      if(est<=0){ estado='bad'; lab='Agotado'; }
      else if(st.min && est < +st.min){ estado='bad'; lab='Bajo el mínimo'; }
      else if(cob!=null && cob < lead){ estado='bad'; lab='Pedir ya'; }
      else if(cob!=null && cob < lead+1){ estado='warn'; lab='Pedir pronto'; }
      else if(avg===0 && !(vendTot[k])){ estado='neutral'; lab='Sin ventas aún'; }
      else if(avg===0){ estado='neutral'; lab='Sin movimiento 90 días'; }
      else { estado='good'; lab='OK'; }
    }
    const cu = D.costo[k] ? D.costo[k].cu : null;
    out[k] = {k, st, est, vendDesde, compDesde, avg, cob, estado, lab, cu, valor: (est!=null && est>0 && cu!=null) ? est*cu : null, camino: D.enCamino[k]||0, vendTot: vendTot[k]||0};
  }
  return out;
}

function barChart(data, opts={}){
  if(!data.length) return '<div class="muted small">Sin datos en el rango.</div>';
  const W=760, H=opts.h||260, pl=64, pr=12, pt=16, pb=34;
  const max = Math.max(...data.map(d=>d.v), 0) || 1, min = Math.min(...data.map(d=>d.v), 0);
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v||1))); const f = v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; };
  const top = nice(max), ticks = 4, iw = W-pl-pr, ih = H-pt-pb;
  const y = v => pt + ih - (v-Math.min(min,0))/(top-Math.min(min,0))*ih;
  const bw = Math.min(46, iw/data.length*0.62), step = iw/data.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Gráfico de barras')}">`;
  for(let i=0;i<=ticks;i++){ const v = top/ticks*i, yy = y(v); s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${short(v)}</text>`; }
  data.forEach((d,i)=>{
    const cx = pl + step*i + step/2, y0 = y(0), y1 = y(Math.max(d.v,0)), h = Math.max(y0-y1, d.v>0?1:0);
    const r = Math.min(4, h, bw/2);
    const path = h>0 ? `M${cx-bw/2},${y0} V${y1+r} Q${cx-bw/2},${y1} ${cx-bw/2+r},${y1} H${cx+bw/2-r} Q${cx+bw/2},${y1} ${cx+bw/2},${y1+r} V${y0} Z` : '';
    s += `<g class="col" data-tip="${esc(d.tip||'')}"><rect class="hit" x="${cx-step/2}" y="${pt}" width="${step}" height="${ih}"/>${path?`<path class="bar" d="${path}" fill="${d.color||'var(--series-1)'}"/>`:''}`;
    if(opts.labels!==false && data.length<=14) s += `<text x="${cx}" y="${y1-6}" text-anchor="middle" style="fill:var(--text-primary);font-weight:500">${esc(d.short||'')}</text>`;
    if(data.length<=16 || i % Math.ceil(data.length/16)===0) s += `<text x="${cx}" y="${H-12}" text-anchor="middle">${esc(d.l)}</text>`;
    s += `</g>`;
  });
  s += `<line class="base" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  return s;
}
function lineChart(xs, series, opts={}){
  if(!xs.length || !series.length) return '<div class="muted small">Sin datos en el rango.</div>';
  const W=760, H=opts.h||280, pl=64, pr=40, pt=16, pb=34, iw=W-pl-pr, ih=H-pt-pb;
  const max = Math.max(1, ...series.flatMap(s=>s.values));
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v||1))); const f = v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; };
  const top = nice(max), step = xs.length>1 ? iw/(xs.length-1) : 0;
  const X = i => pl + (xs.length>1 ? step*i : iw/2), Y = v => pt + ih - Math.max(0,v)/top*ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Gráfico de líneas')}">`;
  for(let i=0;i<=4;i++){ const v = top/4*i; s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${short(v)}</text>`; }
  xs.forEach((x,i)=>{ if(xs.length<=14 || i % Math.ceil(xs.length/14)===0) s += `<text x="${X(i)}" y="${H-12}" text-anchor="middle">${esc(x)}</text>`; });
  for(const se of series){ s += `<polyline fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${se.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>`; }
  // columnas de ayuda: al pasar el mouse se ve el detalle de todos los vendedores ese mes
  xs.forEach((x,i)=>{ const tip = `<b>${esc(x)}</b><br>` + series.map(se=>({n:se.name, v:se.values[i]})).sort((a,b)=>b.v-a.v).map(o=>`${esc(o.n)}: ${money(o.v,0)}`).join('<br>');
    s += `<g class="col" data-tip="${esc(tip)}"><rect class="hit" x="${X(i)-(step||iw)/2}" y="${pt}" width="${step||iw}" height="${ih}"/>${series.map(se=>`<circle cx="${X(i)}" cy="${Y(se.values[i])}" r="3.5" fill="${se.color}" stroke="var(--surface-1)" stroke-width="2"/>`).join('')}</g>`; });
  s += `<line class="base" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}"/></svg>`;
  return s;
}
const short = n => Math.abs(n)>=1e6 ? fmt(n/1e6,1)+'M' : Math.abs(n)>=1e3 ? fmt(n/1e3,1)+'k' : fmt(n,0);
function hbars(rows, total, opts={}){

function donut(items, total){
  // items: [{l, v, color}] ya agrupados (máx. 8)
  const R=88, r=56, C=110; let a0 = -Math.PI/2; let s = `<svg viewBox="0 0 220 220" class="donut" role="img" aria-label="Participación por categoría">`;
  const pos = items.filter(i=>i.v>0), tot = pos.reduce((a,b)=>a+b.v,0) || 1;
  if(pos.length===1){ s += `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${pos[0].color}" stroke-width="${R-r}" data-tip="${esc(`<b>${esc(pos[0].l)}</b><br>${money(pos[0].v)} · 100%`)}"/>`; }
  else for(const it of pos){
    const ang = it.v/tot*Math.PI*2, a1 = a0+ang, gap = 0.012;
    const p = (rad,a)=>[C+rad*Math.cos(a), C+rad*Math.sin(a)];
    const [x1,y1]=p(R,a0+gap),[x2,y2]=p(R,a1-gap),[x3,y3]=p(r,a1-gap),[x4,y4]=p(r,a0+gap), lg = ang>Math.PI?1:0;
    s += `<path d="M${x1},${y1} A${R},${R} 0 ${lg} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${lg} 0 ${x4},${y4} Z" fill="${it.color}" data-tip="${esc(`<b>${esc(it.l)}</b><br>${money(it.v)} · ${pct(it.v/tot)}`)}"/>`;
    a0 = a1;
  }
  s += `<text x="${C}" y="${C-4}" text-anchor="middle" class="dn-v">${esc(short(total))}</text><text x="${C}" y="${C+14}" text-anchor="middle" class="dn-l">${sym()} vendidos</text></svg>`;
  const leg = `<div class="dn-leg">${items.map(it=>`<div data-tip="${esc(`<b>${esc(it.l)}</b><br>${money(it.v)}`)}"><i style="background:${it.color}"></i><span>${esc(it.l)}</span><b>${pct(tot?Math.max(0,it.v)/tot:null,0)}</b></div>`).join('')}</div>`;
  return `<div class="dn-wrap">${s}${leg}</div>`;
}

/* ---- Selector de fechas ---- */
const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const fLarga = s => { if(!s) return ''; const d = pd(s); return `${d.getDate()} ${MESL[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const diasEntre = (a,b) => Math.round((pd(b)-pd(a))/86400000)+1;
function rangoPreset(id){
  const h = today(), d = pd(h), y = d.getFullYear(), m = d.getMonth();
  const lunes = x => { const t = pd(x); const w = (t.getDay()+6)%7; t.setDate(t.getDate()-w); return ymd(t); };
  const finMes = (yy,mm) => ymd(new Date(yy, mm+1, 0));
  const r = {
    hoy:[h,h,'Hoy'], ayer:[addD(h,-1),addD(h,-1),'Ayer'], hoyayer:[addD(h,-1),h,'Hoy y ayer'],
    u7:[addD(h,-6),h,'Últimos 7 días'], u14:[addD(h,-13),h,'Últimos 14 días'], u28:[addD(h,-27),h,'Últimos 28 días'], u30:[addD(h,-29),h,'Últimos 30 días'], u90:[addD(h,-89),h,'Últimos 90 días'],
    semana:[lunes(h),h,'Esta semana'], semanapas:[addD(lunes(h),-7),addD(lunes(h),-1),'La semana pasada'],
    mes:[ymd(new Date(y,m,1)),h,'Este mes'], mespas:[ymd(new Date(y,m-1,1)),finMes(y,m-1),'El mes pasado'],
    anio:[`${y}-01-01`,h,'Este año'], aniopas:[`${y-1}-01-01`,`${y-1}-12-31`,'El año pasado'], todo:['','','Todo el periodo'],
  }[id];
  if(r) return r;
  let mm;
  if((mm = id.match(/^y(\d{4})$/))) return [`${mm[1]}-01-01`,`${mm[1]}-12-31`,`Año ${mm[1]}`];
  if((mm = id.match(/^m(\d{4})-(\d{2})$/))) return [`${mm[1]}-${mm[2]}-01`, finMes(+mm[1], +mm[2]-1), `${MESL[+mm[2]-1][0].toUpperCase()+MESL[+mm[2]-1].slice(1)} ${mm[1]}`];

const CAMPOS = [['c','Código','obligatorio',/C[OÓ]D|SKU|ITEM|REF|PARTE|N[°º]\s*PARTE/i],['n','Nombre del producto','',/NOMBRE|DESCRIP|PRODUCTO|ART[IÍ]CULO|DETALLE/i],['f','Familia','',/FAMILIA|L[IÍ]NEA|SUB\s*CATEG|GRUPO|MODELO/i],['k','Categoría','',/CATEG|RUBRO|TIPO|CLASE|SECCI/i],['a','Códigos alternos','opcional: otros códigos con que lo facturas, OEM o del proveedor, separados por coma. Si una fila no tiene código, se usa el primero de aquí',/ALTERN|EQUIV|PROVEED|OEM|ORIGINAL|OTRO/i],['p','Aplicación','opcional: vehículos o modelos',/APLICACI|VEH[IÍ]CULO/i],['b','Marca','opcional',/^MARCA/i],['m','Stock mínimo','opcional',/M[IÍ]NIMO/i],['s','Stock actual','opcional: lo que tienes hoy en almacén',/STOCK|EXISTENC|SALDO|CANTIDAD|INVENTARIO/i]];
async function leerCatalogo(file){
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  let best = null;
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, defval:''});
    for(let i=0;i<Math.min(rows.length,25);i++){ const r = rows[i]||[]; const txt = r.filter(c=>String(c).trim() && isNaN(+c)).length; const hit = CAMPOS.filter(([,,,re])=>r.some(c=>re.test(String(c)))).length; const score = hit*10+txt; if(txt>=2 && (!best || score>best.score)) best = {sn, hi:i, score, rows}; }
  }
  if(!best) throw new Error('No encontré una fila de encabezados (Código, Nombre, Familia, Categoría…).');
  const H = best.rows[best.hi].map(c=>String(c).trim());
  const map = {}; const usados = new Set();
  for(const [k,,,re] of CAMPOS){ const i = H.findIndex((h,ix)=>h && re.test(h) && !usados.has(ix)); if(i>=0){ map[k] = i; usados.add(i); } }
  const data = best.rows.slice(best.hi+1).filter(r=>r.some(c=>String(c).trim()));
  return {archivo:file.name, hoja:best.sn, H, map, data};
}
function filasCatalogo(imp){
  const g = (r,k) => imp.map[k]!=null && imp.map[k]!=='' ? String(r[imp.map[k]]??'').trim() : '';
  const out = [], vistos = new Set(); let dup = 0, sinCod = 0, porOem = 0; const dups = [], sinCodL = [];
  for(const r of imp.data){
    let c = g(r,'c'); const a = g(r,'a');
    if(!c && a){ c = a.split(/[,;|]+/)[0].trim(); porOem++; }
    if(!c){ sinCod++; sinCodL.push(g(r,'n')||'(fila sin nombre)'); continue; }
    const k = compact(c); if(vistos.has(k)){ dup++; dups.push(c); continue; } vistos.add(k);
    const sv = g(r,'s'), mv = g(r,'m');
    out.push({c, n:g(r,'n'), f:g(r,'f'), k:g(r,'k'), a, p:g(r,'p'), b:g(r,'b'), s: sv!=='' ? parseNum(sv) : null, m: mv!=='' ? parseNum(mv) : null});
  }
  return {rows:out, dup, sinCod, porOem, dups, sinCodL};
}
